<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f3f4f6">
<title>簿記2級 仕訳トレーナー 自動保存版</title>
<style>
:root{--bg:#f3f4f6;--card:#fff;--ink:#111827;--sub:#6b7280;--line:#d1d5db;--accent:#2563eb;--ok:#15803d;--ng:#b91c1c}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;background:var(--bg);color:var(--ink)}
.app{max-width:980px;margin:0 auto;padding:16px 14px 80px}header{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:14px}
h1{font-size:21px;margin:0}.badge{font-size:12px;padding:6px 9px;border-radius:999px;background:#dcfce7;color:#14532d;white-space:nowrap}
.card{background:var(--card);border:1px solid #e5e7eb;border-radius:16px;padding:16px;box-shadow:0 2px 10px rgba(0,0,0,.04);margin-bottom:14px}
.controls{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}label{font-size:12px;color:var(--sub);display:block;margin-bottom:5px}
select,input,button{font:inherit}select,input[type=number]{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:white}
button{border:0;border-radius:11px;padding:11px 14px;font-weight:700;cursor:pointer}.primary{background:var(--accent);color:white}.secondary{background:#e5e7eb;color:#111827}.danger{background:#fee2e2;color:#991b1b}
.status{display:flex;justify-content:space-between;align-items:center;gap:10px;color:var(--sub);font-size:13px}.qtext{white-space:pre-wrap;line-height:1.75;font-size:16px}
.branch{border-top:1px solid #eee;padding-top:14px;margin-top:14px}.branch:first-child{border-top:0;padding-top:0}.branch-title{font-weight:800;margin-bottom:10px}
.journal-grid{display:grid;grid-template-columns:minmax(220px,1fr) 190px minmax(220px,1fr) 190px;gap:8px;align-items:center}.journal-head{font-size:12px;font-weight:700;color:var(--sub)}
.amount{text-align:right;font-size:16px;padding:11px 12px;min-width:170px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.result{margin-top:14px;border-radius:12px;padding:13px;display:none;line-height:1.65}
.result.ok{display:block;background:#dcfce7;color:#14532d}.result.ng{display:block;background:#fee2e2;color:#7f1d1d}.answer{margin-top:8px;padding-top:8px;border-top:1px solid rgba(0,0,0,.12)}
.answer-table-wrap{margin-top:10px;overflow-x:auto}
.answer-branch-title{font-weight:800;margin:12px 0 7px}
.answer-table{width:100%;border-collapse:collapse;background:#fff;color:#111827;border-radius:10px;overflow:hidden}
.answer-table th,.answer-table td{border:1px solid #d1d5db;padding:9px 11px;text-align:left;vertical-align:middle}
.answer-table th{background:#f3f4f6;font-size:12px;font-weight:800}
.answer-table td.account-cell{font-weight:700}
.answer-table td.amount-cell{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:700}
.answer-table .empty-cell{background:#fafafa}
@media(max-width:700px){
  .answer-table th,.answer-table td{padding:8px 7px;font-size:13px}
}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}.stat{padding:10px;background:#f9fafb;border-radius:10px;text-align:center}.stat b{font-size:18px;display:block}
.small{font-size:12px;color:var(--sub)}.hidden{display:none!important}.notice{font-size:13px;line-height:1.6;color:#374151;margin-top:10px}
@media(max-width:700px){.controls{grid-template-columns:1fr 1fr}.journal-grid{grid-template-columns:minmax(0,1fr) 135px}.journal-head.credit{display:none}.credit-account{grid-column:1}.credit-amount{grid-column:2}header{gap:8px}.badge{font-size:11px}}
</style>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>

</head>
<body>
<div class="app">
<header>
  <div>
    <h1>簿記2級 仕訳トレーナー</h1>
    <div class="small">クラウド同期版 v2.4｜iPhoneログイン修正版｜全82問・第1問72問・第4問10問</div>
  </div>
  <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end">
    <span class="badge" id="saveBadge">ローカル保存</span>
    <button class="secondary" id="loginBtn" style="padding:7px 10px;font-size:12px">Googleでログイン</button>
    <button class="secondary hidden" id="logoutBtn" style="padding:7px 10px;font-size:12px">ログアウト</button>
  </div>
</header>

<div class="card" id="setup">
  <div class="controls">
    <div><label>対策</label><select id="section"><option value="第1問対策">第1問対策</option><option value="第4問対策">第4問対策・工業簿記</option><option value="ALL">全部</option></select></div>
    <div><label>出題順</label><select id="mode"><option value="random">ランダム</option><option value="weak">苦手優先</option><option value="wrong">前回不正解のみ</option><option value="unseen">未出題のみ</option></select></div>
    <div><label>問題数</label><select id="count"><option value="5">5問</option><option value="10" selected>10問</option><option value="20">20問</option><option value="ALL">全部</option></select></div>
    <div style="display:flex;align-items:end"><button class="primary" id="startBtn" style="width:100%">演習開始</button></div>
  </div>
  <div class="stats" id="stats"></div>
  <div class="notice">Googleログイン中は、採点した瞬間に成績と演習位置をFirestoreへ自動保存します。PCとiPhoneで同じGoogleアカウントを使えば同期されます。</div>
  <div class="actions"><button class="secondary" id="backupBtn">成績バックアップ</button><button class="secondary" id="restoreBtn">バックアップ読込</button><input id="restoreFile" type="file" accept=".json,application/json" class="hidden"><button class="danger" id="resetBtn">成績をリセット</button></div>
</div>

<div id="resumeCard" class="card hidden">
  <b>途中の演習があります</b>
  <div class="notice" id="resumeText"></div>
  <div class="actions"><button class="primary" id="resumeBtn">続きから再開</button><button class="secondary" id="discardSessionBtn">破棄</button></div>
</div>

<div id="quiz" class="hidden">
  <div class="status card"><span id="progress"></span><span id="meta"></span></div>
  <div class="card"><div class="qtext" id="qtext"></div></div>
  <div class="card">
    <div id="answerArea"></div>
    <div class="actions">
      <button class="primary" id="gradeBtn">採点する</button>
      <button class="secondary" id="uncertainBtn">解けたけど微妙</button>
      <button class="danger" id="dontKnowBtn">わからない</button>
      <button class="secondary hidden" id="nextBtn">次の問題</button>
      <button class="secondary" id="quitBtn">メニューへ</button>
    </div>
    <div id="result" class="result"></div>
  </div>
</div>
</div>

<script>
const QUESTIONS = [{"id": "J2-001", "category": "純資産", "subcategory": "新株発行", "difficulty": 2, "question": "青森商事株式会社は、増資のため、株式1,000株を1株あたり￥500で発行し、全額の払い込みを受け、払込金は当座預金とした。なお、会社法が認める最低額を資本金とする。", "options": ["現金", "当座預金", "資本金", "資本準備金", "利益準備金", "繰越利益剰余金", "普通預金"], "debit": [{"branch": "main", "account": "当座預金", "amount": 500000}], "credit": [{"branch": "main", "account": "資本金", "amount": 250000}, {"branch": "main", "account": "資本準備金", "amount": 250000}], "explanation": "払込額500,000円。会社法上の最低額を資本金とするため、1/2を資本金、残りを資本準備金。", "section": "第1問対策"}, {"id": "J2-002", "category": "純資産", "subcategory": "会社設立", "difficulty": 3, "question": "会社の設立に際し、普通株式1,000株を＠￥90,000で発行し、払込金は当座預金とした。なお、株券の印刷費￥100,000と設立登記のための費用￥90,000は現金で支払った。資本金とする額は、会社法が認める最低限度額とする。", "options": ["資本金", "現金", "創立費", "資本準備金", "株式交付費", "当座預金", "利益準備金"], "debit": [{"branch": "main", "account": "当座預金", "amount": 90000000}, {"branch": "main", "account": "創立費", "amount": 190000}], "credit": [{"branch": "main", "account": "資本金", "amount": 45000000}, {"branch": "main", "account": "資本準備金", "amount": 45000000}, {"branch": "main", "account": "現金", "amount": 190000}], "explanation": "設立時の払込90,000,000円の1/2を資本金。提示解答では株券印刷費・設立登記費を創立費として処理。", "section": "第1問対策"}, {"id": "J2-003", "category": "純資産", "subcategory": "新株発行・株式交付費", "difficulty": 3, "question": "会社設立後の新株発行に際し、普通株式500株を＠￥100,000で発行し、払込金は当座預金とした。なお、株券の印刷費￥80,000は現金で支払った。なお、払込金の8割に相当する金額を資本金とする。", "options": ["利益準備金", "資本金", "株式交付費", "現金", "資本準備金", "当座預金", "創立費"], "debit": [{"branch": "main", "account": "当座預金", "amount": 50000000}, {"branch": "main", "account": "株式交付費", "amount": 80000}], "credit": [{"branch": "main", "account": "資本金", "amount": 40000000}, {"branch": "main", "account": "資本準備金", "amount": 10000000}, {"branch": "main", "account": "現金", "amount": 80000}], "explanation": "払込額50,000,000円の80%を資本金、残額を資本準備金。設立後の株券印刷費は株式交付費。", "section": "第1問対策"}, {"id": "J2-004", "category": "純資産", "subcategory": "株式申込証拠金", "difficulty": 4, "question": "岩手工業株式会社は、新株300株を1株あたり￥70,000で発行し、払込期日までに申込証拠金の全額が払い込まれ、別段預金に預け入れていたが、本日が払込期日となるため、別段預金を当座預金に預け替えた。なお、会社法が認める最低額を資本金とする。", "options": ["株式申込証拠金", "当座預金", "資本金", "別段預金", "資本準備金", "利益準備金", "別途積立金"], "debit": [{"branch": "main", "account": "株式申込証拠金", "amount": 21000000}, {"branch": "main", "account": "当座預金", "amount": 21000000}], "credit": [{"branch": "main", "account": "資本金", "amount": 10500000}, {"branch": "main", "account": "資本準備金", "amount": 10500000}, {"branch": "main", "account": "別段預金", "amount": 21000000}], "explanation": "払込期日に申込証拠金を資本金等へ振替。同時に別段預金から当座預金へ預け替える複合仕訳。", "section": "第1問対策"}, {"id": "J2-005", "category": "企業結合", "subcategory": "事業買収・のれん", "difficulty": 3, "question": "山形商事株式会社は宮城商事株式会社を￥4,200,000で買収し、小切手を振り出して支払った。なお、宮城商事株式会社を買収した際の資産および負債の時価は、受取手形￥3,500,000、商品￥2,200,000、買掛金￥1,850,000であった。", "options": ["現金", "受取手形", "買掛金", "のれん", "仕入", "資本準備金", "利益準備金", "資本金", "当座預金"], "debit": [{"branch": "main", "account": "受取手形", "amount": 3500000}, {"branch": "main", "account": "仕入", "amount": 2200000}, {"branch": "main", "account": "のれん", "amount": 350000}], "credit": [{"branch": "main", "account": "買掛金", "amount": 1850000}, {"branch": "main", "account": "当座預金", "amount": 4200000}], "explanation": "受入純資産3,850,000円に対し買収額4,200,000円。差額350,000円がのれん。", "section": "第1問対策"}, {"id": "J2-006", "category": "純資産", "subcategory": "剰余金の配当・利益準備金", "difficulty": 4, "question": "当期の6月20日に開催された株主総会で、以下のように繰越利益剰余金の処分が行われた。なお、同社の資本金は￥20,000,000、資本準備金は￥2,000,000、利益準備金は￥500,000（積立前）であった。株主配当金￥1,800,000、別途積立金￥800,000、利益準備金は会社法の定める必要額。", "options": ["未払配当金", "利益準備金", "別途積立金", "資本準備金", "繰越利益剰余金", "普通預金", "資本金"], "debit": [{"branch": "main", "account": "繰越利益剰余金", "amount": 2780000}], "credit": [{"branch": "main", "account": "未払配当金", "amount": 1800000}, {"branch": "main", "account": "別途積立金", "amount": 800000}, {"branch": "main", "account": "利益準備金", "amount": 180000}], "explanation": "準備金の上限は資本金の1/4。配当額の1/10=180,000円を利益準備金へ積立。", "section": "第1問対策"}, {"id": "J2-007", "category": "純資産", "subcategory": "剰余金の配当・準備金上限", "difficulty": 4, "question": "当期の6月25日に開催された株主総会で、以下のように繰越利益剰余金の処分が行われた。なお、同社の資本金は￥10,000,000、資本準備金は￥1,600,000、利益準備金は￥800,000（積立前）であった。株主配当金はただちに当座預金口座から支払った。株主配当金￥1,300,000、新築積立金￥80,000、利益準備金は会社法の定める必要額。", "options": ["資本金", "資本準備金", "利益準備金", "当座預金", "新築積立金", "別途積立金", "繰越利益剰余金"], "debit": [{"branch": "main", "account": "繰越利益剰余金", "amount": 1480000}], "credit": [{"branch": "main", "account": "当座預金", "amount": 1300000}, {"branch": "main", "account": "利益準備金", "amount": 100000}, {"branch": "main", "account": "新築積立金", "amount": 80000}], "explanation": "資本金の1/4は2,500,000円。既存準備金合計2,400,000円なので追加可能額は100,000円。", "section": "第1問対策"}, {"id": "J2-008", "category": "純資産", "subcategory": "その他資本剰余金からの配当", "difficulty": 4, "question": "株主総会の決議において、配当￥300,000（配当財源はその他資本剰余金から￥100,000、繰越利益剰余金から￥200,000）が決定した。また、配当金の10分の1を準備金として積み立てた。", "options": ["資本準備金", "利益準備金", "その他資本剰余金", "別途積立金", "未払配当金", "繰越利益剰余金", "資本金"], "debit": [{"branch": "main", "account": "その他資本剰余金", "amount": 110000}, {"branch": "main", "account": "繰越利益剰余金", "amount": 220000}], "credit": [{"branch": "main", "account": "未払配当金", "amount": 300000}, {"branch": "main", "account": "資本準備金", "amount": 10000}, {"branch": "main", "account": "利益準備金", "amount": 20000}], "explanation": "配当財源の比率に応じ、その他資本剰余金分は資本準備金、繰越利益剰余金分は利益準備金へ積立。", "section": "第1問対策"}, {"id": "J2-009", "category": "純資産", "subcategory": "準備金への組入れ", "difficulty": 2, "question": "株主総会の決議によって、その他資本剰余金￥500,000および繰越利益剰余金￥400,000をそれぞれ準備金に組み入れることとした。", "options": ["繰越利益剰余金", "資本金", "その他資本剰余金", "利益準備金", "資本準備金", "別途積立金", "未払金"], "debit": [{"branch": "main", "account": "その他資本剰余金", "amount": 500000}, {"branch": "main", "account": "繰越利益剰余金", "amount": 400000}], "credit": [{"branch": "main", "account": "資本準備金", "amount": 500000}, {"branch": "main", "account": "利益準備金", "amount": 400000}], "explanation": "資本剰余金は資本準備金へ、利益剰余金は利益準備金へ組み入れる。", "section": "第1問対策"}, {"id": "J2-010", "category": "純資産", "subcategory": "当期純損失の振替", "difficulty": 2, "question": "福島物産株式会社は、当期の決算において￥5,400,000の損失を計上した。", "options": ["損益", "資本金", "繰越利益剰余金", "利益準備金", "資本準備金", "売上", "仕入"], "debit": [{"branch": "main", "account": "繰越利益剰余金", "amount": 5400000}], "credit": [{"branch": "main", "account": "損益", "amount": 5400000}], "explanation": "当期純損失は損益勘定から繰越利益剰余金へ振り替える。", "section": "第1問対策"}, {"id": "J2-011", "category": "税金", "subcategory": "法人税等・中間納付", "difficulty": 2, "question": "決算に際して、税引前当期純利益￥1,500,000の30%を法人税、住民税及び事業税として計上した。なお、￥200,000については期中において中間納付をしている。", "options": ["未払法人税等", "仮払法人税等", "租税公課", "仮受消費税", "仮払消費税", "法人税、住民税及び事業税", "支払手数料"], "debit": [{"branch": "main", "account": "法人税、住民税及び事業税", "amount": 450000}], "credit": [{"branch": "main", "account": "仮払法人税等", "amount": 200000}, {"branch": "main", "account": "未払法人税等", "amount": 250000}], "explanation": "税引前当期純利益1,500,000円×30%=450,000円。中間納付200,000円を仮払法人税等から振り替え、残額250,000円を未払計上。", "section": "第1問対策"}, {"id": "J2-012", "category": "税金", "subcategory": "法人税等・損金不算入", "difficulty": 3, "question": "×1年度の決算において、税引前当期純利益は￥400,000計上している。しかし、減価償却費の損金不算入額が￥350,000あった。当期の法人税、住民税及び事業税の法定実効税率を30%として、未払法人税等を計上する。", "options": ["法人税、住民税及び事業税", "租税公課", "仮払法人税等", "未払法人税等", "仮受消費税", "仮払消費税", "法人税等調整額"], "debit": [{"branch": "main", "account": "法人税、住民税及び事業税", "amount": 225000}], "credit": [{"branch": "main", "account": "未払法人税等", "amount": 225000}], "explanation": "課税所得は会計利益400,000円＋損金不算入350,000円=750,000円。×30%=225,000円。", "section": "第1問対策"}, {"id": "J2-013", "category": "税金", "subcategory": "消費税・税抜方式", "difficulty": 2, "question": "決算に際して、消費税の納付額を計算し、これを確定した。なお、消費税の会計処理は税抜方式によっており、当期の消費税仮払分は￥300,000、消費税仮受分は￥450,000であった。", "options": ["租税公課", "未払消費税", "未収還付消費税", "仮払消費税", "仮受消費税", "未払法人税等", "法人税等調整額"], "debit": [{"branch": "main", "account": "仮受消費税", "amount": 450000}], "credit": [{"branch": "main", "account": "仮払消費税", "amount": 300000}, {"branch": "main", "account": "未払消費税", "amount": 150000}], "explanation": "仮受消費税450,000円から仮払消費税300,000円を控除し、差額150,000円を未払消費税とする。", "section": "第1問対策"}, {"id": "J2-014", "category": "商品売買", "subcategory": "商品売買・売上原価対立法", "difficulty": 2, "question": "横浜商事は、池袋商事より商品￥150,000（＠￥500×300個）を仕入れ、代金は掛けとした。なお、同社では商品売買に関しては、商品を仕入れたときに商品勘定に記入し、販売のつど売上原価を売上原価勘定に振り替える方法で記帳している。", "options": ["買掛金", "商品", "仕入", "売上原価", "繰越商品", "売掛金", "売上"], "debit": [{"branch": "main", "account": "商品", "amount": 150000}], "credit": [{"branch": "main", "account": "買掛金", "amount": 150000}], "explanation": "売上原価対立法では仕入時に『仕入』ではなく『商品』を計上する。", "section": "第1問対策"}, {"id": "J2-015", "category": "商品売買", "subcategory": "商品販売・売上原価対立法", "difficulty": 3, "question": "東京商事は千葉商事に商品50個（原価＠￥200、売価＠￥320）を売り上げ、代金は掛けとした。なお、東京商事では商品売買に関して、商品を仕入れたときに商品勘定で処理し、販売のつど売上原価を売上原価勘定に振り替える方法で記帳している。", "options": ["売上原価", "売掛金", "商品", "売上", "仕入", "繰越商品", "買掛金"], "debit": [{"branch": "main", "account": "売掛金", "amount": 16000}, {"branch": "main", "account": "売上原価", "amount": 10000}], "credit": [{"branch": "main", "account": "売上", "amount": 16000}, {"branch": "main", "account": "商品", "amount": 10000}], "explanation": "売価は320円×50個=16,000円、原価は200円×50個=10,000円。販売仕訳と原価振替を同時に行う。", "section": "第1問対策"}, {"id": "J2-016", "category": "商品売買", "subcategory": "クレジット売掛金", "difficulty": 2, "question": "群馬商事は商品￥200,000をクレジット払いの条件で販売した。なお、信販会社への手数料は販売代金の4%とし、販売時に計上し、信販会社に対する債権から控除する。", "options": ["支払利息", "支払手数料", "クレジット売掛金", "売上", "当座預金", "仕入", "買掛金"], "debit": [{"branch": "main", "account": "クレジット売掛金", "amount": 192000}, {"branch": "main", "account": "支払手数料", "amount": 8000}], "credit": [{"branch": "main", "account": "売上", "amount": 200000}], "explanation": "手数料は200,000円×4%=8,000円。信販会社への債権は差引192,000円。", "section": "第1問対策"}, {"id": "J2-017", "category": "商品売買", "subcategory": "クレジット売掛金・消費税", "difficulty": 4, "question": "商品￥100,000をクレジット払いの条件で顧客に販売し、信販会社へのクレジット手数料（販売代金の4%）を販売時に認識した。なお、消費税の税率は販売代金に対して10%とし、税抜方式で処理するが、クレジット手数料には消費税は課税されない。", "options": ["仮受消費税", "売上", "支払手数料", "未払消費税", "クレジット売掛金", "仮払消費税", "租税公課"], "debit": [{"branch": "main", "account": "クレジット売掛金", "amount": 106000}, {"branch": "main", "account": "支払手数料", "amount": 4000}], "credit": [{"branch": "main", "account": "売上", "amount": 100000}, {"branch": "main", "account": "仮受消費税", "amount": 10000}], "explanation": "まず売上100,000円＋仮受消費税10,000円を認識。クレジット手数料は販売代金100,000円×4%=4,000円で、税込債権110,000円から差し引きクレジット売掛金106,000円。", "section": "第1問対策"}, {"id": "J2-018", "category": "手形・電子記録債権等", "subcategory": "手形の更改", "difficulty": 3, "question": "かねて振り出していた約束手形￥300,000について、手形の所持人である札幌商事に対して手形の更改を申し入れ、同社の了承を得て、旧手形と交換して新手形を振り出した。なお、支払期日の延長にともなう利息￥6,000は新手形の額面金額に含めて処理する。", "options": ["受取手形", "支払手形", "支払手数料", "現金", "受取利息", "未払金", "支払利息"], "debit": [{"branch": "main", "account": "支払手形", "amount": 300000}, {"branch": "main", "account": "支払利息", "amount": 6000}], "credit": [{"branch": "main", "account": "支払手形", "amount": 306000}], "explanation": "旧手形300,000円を消滅させ、延長利息6,000円を加えた新手形306,000円を計上する。", "section": "第1問対策"}, {"id": "J2-019", "category": "手形・電子記録債権等", "subcategory": "電子記録債務の発生", "difficulty": 2, "question": "岐阜商事は、三重商事に対する買掛金￥300,000の支払いを電子債権記録機関で行うため、取引銀行を通じて債務の発生記録を行った。", "options": ["支払手形", "売掛金", "電子記録債務", "電子記録債権", "買掛金", "当座預金", "未払金"], "debit": [{"branch": "main", "account": "買掛金", "amount": 300000}], "credit": [{"branch": "main", "account": "電子記録債務", "amount": 300000}], "explanation": "買掛金を電子記録債務へ振り替える。", "section": "第1問対策"}, {"id": "J2-020", "category": "手形・電子記録債権等", "subcategory": "電子記録債権の決済", "difficulty": 2, "question": "電子債権記録機関で発生記録した債権￥300,000の支払期日が到来したので、三重商事の当座預金口座に債権金額が振り込まれた。", "options": ["電子記録債務", "当座預金", "買掛金", "電子記録債権", "普通預金", "売掛金", "受取手形"], "debit": [{"branch": "main", "account": "当座預金", "amount": 300000}], "credit": [{"branch": "main", "account": "電子記録債権", "amount": 300000}], "explanation": "支払期日に電子記録債権が決済され、当座預金へ入金される。", "section": "第1問対策"}, {"id": "J2-021", "category": "手形・電子記録債権等", "subcategory": "電子記録債権の譲渡", "difficulty": 2, "question": "富山商事は、新潟商事に対する買掛金￥200,000の支払いのため、取引銀行を通じて電子記録債権の譲渡記録を行った。", "options": ["当座預金", "売掛金", "電子記録債権売却損", "電子記録債務", "電子記録債権", "買掛金", "手形売却損"], "debit": [{"branch": "main", "account": "買掛金", "amount": 200000}], "credit": [{"branch": "main", "account": "電子記録債権", "amount": 200000}], "explanation": "保有する電子記録債権を譲渡して買掛金を決済する。", "section": "第1問対策"}, {"id": "J2-022", "category": "手形・電子記録債権等", "subcategory": "電子記録債権の譲渡・売却", "difficulty": 4, "question": "川崎商事は電子記録債権￥500,000を横浜商事に譲渡し、譲渡記録を行った。このうち￥300,000は横浜商事に対する買掛金を決済するためのものであり、残りは換金代金￥190,000を得るためのものである。換金代金は当座預金口座に入金された。", "options": ["電子記録債権", "電子記録債務", "売上", "買掛金", "売掛金", "当座預金", "電子記録債権売却損"], "debit": [{"branch": "main", "account": "買掛金", "amount": 300000}, {"branch": "main", "account": "当座預金", "amount": 190000}, {"branch": "main", "account": "電子記録債権売却損", "amount": 10000}], "credit": [{"branch": "main", "account": "電子記録債権", "amount": 500000}], "explanation": "500,000円のうち300,000円は買掛金決済。残り200,000円分を190,000円で換金したため、差額10,000円は電子記録債権売却損。", "section": "第1問対策"}, {"id": "J2-023", "category": "手形・電子記録債権等", "subcategory": "電子記録債権の割引", "difficulty": 3, "question": "神奈川商事は、電子記録債権￥180,000を銀行で割り引き、割引料￥1,000が差し引かれた残額を当座預金口座に受け入れた。", "options": ["電子記録債権売却損", "電子記録債務", "電子記録債権", "手形売却損", "現金", "当座預金", "受取手形"], "debit": [{"branch": "main", "account": "電子記録債権売却損", "amount": 1000}, {"branch": "main", "account": "当座預金", "amount": 179000}], "credit": [{"branch": "main", "account": "電子記録債権", "amount": 180000}], "explanation": "電子記録債権の割引料は電子記録債権売却損として処理する。", "section": "第1問対策"}, {"id": "J2-024", "category": "手形・電子記録債権等", "subcategory": "売掛金の売却", "difficulty": 3, "question": "奈良商事に対する売掛金￥100,000を、奈良商事の承諾を得て、京都商事に￥98,000で売り渡した。なお、売却代金は普通預金口座に入金された。", "options": ["買掛金", "売掛金", "当座預金", "普通預金", "債権売却損", "受取手形", "支払手形"], "debit": [{"branch": "main", "account": "普通預金", "amount": 98000}, {"branch": "main", "account": "債権売却損", "amount": 2000}], "credit": [{"branch": "main", "account": "売掛金", "amount": 100000}], "explanation": "売掛金100,000円を98,000円で売却した差額2,000円を債権売却損として処理する。", "section": "第1問対策"}, {"id": "J2-025", "category": "現金預金", "subcategory": "未渡小切手", "difficulty": 2, "question": "決算日において、すでに掛け代金の支払いとして処理されていた小切手￥200,000が未渡しであることが判明した。", "options": ["支払手形", "買掛金", "当座預金", "売掛金", "現金", "受取手形", "未払金"], "debit": [{"branch": "main", "account": "当座預金", "amount": 200000}], "credit": [{"branch": "main", "account": "買掛金", "amount": 200000}], "explanation": "未渡小切手はまだ銀行から支払われていないため、いったん減額していた当座預金を戻し、買掛金も復活させる。", "section": "第1問対策"}, {"id": "J2-026", "category": "現金預金", "subcategory": "銀行勘定調整・未達/未取付/未渡", "difficulty": 4, "question": "決算に際して当座預金の残高を確認したところ、当社の帳簿残高と銀行が発行した残高証明書の残高に不一致があったため、原因を調べたところ、次の事実が判明したので、必要な修正処理を行った。なお、当社において仕訳が不要な場合は借方科目の欄に「キ」（仕訳なし）と記号を記入すること。\n① 電気代￥50,000が当座預金口座から引き落とされていたが、この連絡が当社に未達であった。\n② 買掛金の支払いのために振り出した小切手￥150,000が決算日現在、銀行に呈示されていなかった。\n③ 備品の購入にかかる未払金を支払うために振り出した小切手￥200,000が未渡しのまま当社の金庫に保管されていた。", "options": ["現金", "水道光熱費", "未払金", "当座預金", "買掛金", "前払金", "仕訳なし"], "debit": [{"branch": "①", "account": "水道光熱費", "amount": 50000}, {"branch": "②", "account": "仕訳なし", "amount": null}, {"branch": "③", "account": "当座預金", "amount": 200000}], "credit": [{"branch": "①", "account": "当座預金", "amount": 50000}, {"branch": "②", "account": "仕訳なし", "amount": null}, {"branch": "③", "account": "未払金", "amount": 200000}], "explanation": "① 銀行側で引落済み・会社未記帳なので修正仕訳が必要。② 未取付小切手は会社側ではすでに正しく記帳済みなので仕訳なし。③ 未渡小切手は実際には支払っていないため、当座預金と未払金を戻す。①②③をまとめて1問として扱う。", "section": "第1問対策"}, {"id": "J2-027", "category": "固定資産", "subcategory": "備品購入・営業外支払手形", "difficulty": 2, "question": "店舗で使用する商品陳列棚￥200,000を購入し、代金は約束手形を振り出して支払った。", "options": ["貯蔵品", "営業外受取手形", "営業外支払手形", "備品", "当座預金", "受取手形", "未払金"], "debit": [{"branch": "main", "account": "備品", "amount": 200000}], "credit": [{"branch": "main", "account": "営業外支払手形", "amount": 200000}], "explanation": "固定資産の購入代金として振り出した手形は、営業取引外なので営業外支払手形で処理する。", "section": "第1問対策"}, {"id": "J2-028", "category": "固定資産", "subcategory": "土地売却・営業外受取手形", "difficulty": 2, "question": "帳簿価額￥10,000,000の土地を￥12,000,000で売却した。売却代金のうち￥2,000,000は現金で受け取り、残額は先方振出の約束手形を受け取った。", "options": ["未収入金", "現金", "固定資産売却益", "固定資産売却損", "営業外支払手形", "営業外受取手形", "土地"], "debit": [{"branch": "main", "account": "現金", "amount": 2000000}, {"branch": "main", "account": "営業外受取手形", "amount": 10000000}], "credit": [{"branch": "main", "account": "土地", "amount": 10000000}, {"branch": "main", "account": "固定資産売却益", "amount": 2000000}], "explanation": "固定資産売却で受け取った手形は営業外受取手形。売価12,000,000円と帳簿価額10,000,000円の差額2,000,000円が売却益。", "section": "第1問対策"}, {"id": "J2-029", "category": "固定資産", "subcategory": "割賦購入・支払利息振替", "difficulty": 3, "question": "埼玉商事は×2年10月1日に営業用車両（現金販売価額は￥2,400,000）を割賦購入した際、毎月末日に支払期限の到来する額面￥500,000の約束手形5枚を振り出している。本日（×2年10月31日）、当該約束手形の支払期日となったため、当座預金口座から手形代金を支払った。なお、購入時において利息相当額は前払利息勘定で処理しており、手形代金の支払いのつど、利息相当額を前払利息勘定から支払利息勘定に振り替える。", "options": ["当座預金", "前払利息", "車両運搬具", "営業外支払手形", "支払利息", "未払金", "営業外受取手形"], "debit": [{"branch": "main", "account": "営業外支払手形", "amount": 500000}, {"branch": "main", "account": "支払利息", "amount": 20000}], "credit": [{"branch": "main", "account": "当座預金", "amount": 500000}, {"branch": "main", "account": "前払利息", "amount": 20000}], "explanation": "手形総額2,500,000円と現金価格2,400,000円との差100,000円が総利息。5回払いなので1回20,000円を前払利息から支払利息へ振り替える。", "section": "第1問対策"}, {"id": "J2-030", "category": "固定資産", "subcategory": "生産高比例法", "difficulty": 3, "question": "決算に際し、営業用車両（取得原価￥4,000,000、減価償却累計額￥480,000、間接法で記帳）について、生産高比例法により減価償却を行った。この車両の残存価額は取得原価の10％、見積総走行可能距離は300,000kmであり、当期の実際走行距離は45,000kmであった。", "options": ["当座預金", "車両運搬具", "備品減価償却累計額", "備品", "車両運搬具減価償却累計額", "減価償却費"], "debit": [{"branch": "main", "account": "減価償却費", "amount": 540000}], "credit": [{"branch": "main", "account": "車両運搬具減価償却累計額", "amount": 540000}], "explanation": "（4,000,000−400,000）÷300,000km×45,000km＝540,000円。", "section": "第1問対策"}, {"id": "J2-031", "category": "固定資産", "subcategory": "車両下取り・生産高比例法", "difficulty": 5, "question": "営業用車両（取得原価￥5,000,000、残存価額￥500,000、前期末における減価償却累計額￥3,600,000、減価償却方法は生産高比例法、見積総走行可能距離は200,000km、当期の走行距離は12,000km、記帳方法は間接法）を下取りさせて、新たな営業用車両（購入価額￥3,000,000）を購入した。なお、旧車両の下取価額は￥600,000で、購入価額との差額は月末に支払うこととした。", "options": ["車両運搬具", "固定資産売却益", "減価償却費", "固定資産売却損", "未払金", "車両運搬具減価償却累計額", "買掛金"], "debit": [{"branch": "main", "account": "車両運搬具", "amount": 3000000}, {"branch": "main", "account": "車両運搬具減価償却累計額", "amount": 3600000}, {"branch": "main", "account": "減価償却費", "amount": 270000}, {"branch": "main", "account": "固定資産売却損", "amount": 530000}], "credit": [{"branch": "main", "account": "車両運搬具", "amount": 5000000}, {"branch": "main", "account": "未払金", "amount": 2400000}], "explanation": "当期償却額は（5,000,000−500,000）÷200,000km×12,000km＝270,000円。旧車の帳簿価額は1,130,000円、下取600,000円との差530,000円が売却損。", "section": "第1問対策"}, {"id": "J2-032", "category": "固定資産", "subcategory": "固定資産除却・直接法", "difficulty": 3, "question": "当期首において、使用中の備品￥400,000（前期末における減価償却累計額は￥315,000、記帳方法は直接法）を除却した。なお、当該備品の処分価額は￥30,000と見積られた。", "options": ["備品減価償却累計額", "固定資産除却損", "固定資産売却損", "固定資産売却益", "備品", "機械装置", "貯蔵品"], "debit": [{"branch": "main", "account": "貯蔵品", "amount": 30000}, {"branch": "main", "account": "固定資産除却損", "amount": 55000}], "credit": [{"branch": "main", "account": "備品", "amount": 85000}], "explanation": "直接法なので帳簿上の備品残高は400,000−315,000＝85,000円。処分価額30,000円を貯蔵品とし、差額55,000円を除却損。", "section": "第1問対策"}, {"id": "J2-033", "category": "固定資産", "subcategory": "建設仮勘定・建物完成", "difficulty": 4, "question": "建設中の営業用店舗が完成したため、店舗の引き渡しを受け、工事代金の残額￥6,500,000のうち￥1,000,000と登記料￥90,000については小切手を振り出して支払い、残額は翌月に支払うこととした。なお、当該店舗について、工事代金の一部としてすでに￥3,500,000を支払っている。", "options": ["建設仮勘定", "当座預金", "買掛金", "建物", "未収入金", "未払金", "備品"], "debit": [{"branch": "main", "account": "建物", "amount": 10090000}], "credit": [{"branch": "main", "account": "建設仮勘定", "amount": 3500000}, {"branch": "main", "account": "当座預金", "amount": 1090000}, {"branch": "main", "account": "未払金", "amount": 5500000}], "explanation": "工事代金総額10,000,000円に登記料90,000円を取得原価へ加算。既払分は建設仮勘定から振り替える。", "section": "第1問対策"}, {"id": "J2-034", "category": "固定資産", "subcategory": "修繕・資本的支出・修繕引当金", "difficulty": 4, "question": "当期首において、営業用建物（取得原価￥8,000,000）の修繕を行い、代金￥900,000のうち￥200,000については小切手を振り出して支払い、残額は月末に支払うこととした。なお、修繕代金￥900,000のうち￥500,000については建物の耐用年数を延長させる効果があると認められる。また、修繕引当金の残高は￥250,000である。", "options": ["当座預金", "修繕費", "修繕引当金", "現金", "未払金", "建物", "租税公課"], "debit": [{"branch": "main", "account": "建物", "amount": 500000}, {"branch": "main", "account": "修繕引当金", "amount": 250000}, {"branch": "main", "account": "修繕費", "amount": 150000}], "credit": [{"branch": "main", "account": "当座預金", "amount": 200000}, {"branch": "main", "account": "未払金", "amount": 700000}], "explanation": "耐用年数を延長する500,000円は資本的支出として建物。残り400,000円の修繕のうち250,000円は引当金を取り崩し、150,000円を修繕費。", "section": "第1問対策"}, {"id": "J2-035", "category": "固定資産", "subcategory": "火災・未決算", "difficulty": 5, "question": "×7年4月30日、火災が発生し、建物（取得原価￥5,400,000、減価償却累計額￥2,700,000）が焼失した。この建物には火災保険￥3,000,000が掛けられていたので、保険会社に保険金の支払請求をした。なお、当該建物の当期の減価償却費は月割りで計上する。建物の減価償却方法は定額法（耐用年数30年、残存価額はゼロ、記帳方法は間接法）により行っており、決算日は年1回、3月31日である。", "options": ["減価償却費", "建物", "未収入金", "現金", "保険差益", "火災損失", "建物減価償却累計額", "未決算"], "debit": [{"branch": "main", "account": "建物減価償却累計額", "amount": 2700000}, {"branch": "main", "account": "減価償却費", "amount": 15000}, {"branch": "main", "account": "未決算", "amount": 2685000}], "credit": [{"branch": "main", "account": "建物", "amount": 5400000}], "explanation": "年額減価償却費180,000円、4月の1か月分15,000円を追加計上。焼失時帳簿価額2,685,000円を未決算へ振り替える。", "section": "第1問対策"}, {"id": "J2-036", "category": "固定資産", "subcategory": "保険金確定・保険差益", "difficulty": 5, "question": "火災により焼失した建物（取得原価：￥8,000,000、残存価額：取得原価の10%、耐用年数30年、減価償却方法は定額法、記帳方法は間接法）について請求していた保険金￥5,000,000について、保険金￥3,800,000を支払う旨の連絡を、本日、保険会社から受けた。当該建物は、当期首から18年前に取得したもので、当期の7月31日に火災が発生したため、火災発生日における帳簿価額を未決算勘定に振り替えていた。なお、決算日は年1回、3月31日であり、減価償却費の計上は月割りで行っている。", "options": ["火災損失", "未収入金", "保険差益", "未決算", "建物減価償却累計額", "減価償却費", "建物"], "debit": [{"branch": "main", "account": "未収入金", "amount": 3800000}], "credit": [{"branch": "main", "account": "未決算", "amount": 3600000}, {"branch": "main", "account": "保険差益", "amount": 200000}], "explanation": "焼失時の帳簿価額は3,600,000円。確定保険金3,800,000円との差額200,000円を保険差益とする。", "section": "第1問対策"}, {"id": "J2-037", "category": "固定資産", "subcategory": "国庫補助金", "difficulty": 2, "question": "愛知商事は、備品の取得を助成するため国より交付された補助金￥300,000を受け取り、当座預金とした。", "options": ["国庫補助金受贈益", "備品", "当座預金", "未払金", "固定資産圧縮損", "固定資産売却益", "未決算"], "debit": [{"branch": "main", "account": "当座預金", "amount": 300000}], "credit": [{"branch": "main", "account": "国庫補助金受贈益", "amount": 300000}], "explanation": "受け取った国庫補助金は国庫補助金受贈益として収益計上する。", "section": "第1問対策"}, {"id": "J2-038", "category": "固定資産", "subcategory": "圧縮記帳・直接控除方式", "difficulty": 3, "question": "愛知商事は、期首に上記11.の補助金と自己資金により、備品￥1,000,000を取得し、代金は今月末に支払うことにした。なお、この備品については補助金に相当する額の圧縮記帳（直接控除方式）を行った。", "options": ["固定資産圧縮損", "国庫補助金受贈益", "備品", "未払金", "未収入金", "固定資産売却損", "減価償却費"], "debit": [{"branch": "main", "account": "備品", "amount": 1000000}, {"branch": "main", "account": "固定資産圧縮損", "amount": 300000}], "credit": [{"branch": "main", "account": "未払金", "amount": 1000000}, {"branch": "main", "account": "備品", "amount": 300000}], "explanation": "いったん備品1,000,000円を計上後、補助金相当額300,000円を固定資産圧縮損として備品から直接控除する。圧縮後の帳簿価額は700,000円。", "section": "第1問対策"}, {"id": "J2-039", "category": "固定資産", "subcategory": "圧縮記帳後の減価償却", "difficulty": 3, "question": "愛知商事は、本日決算日につき、上記12.の備品について定額法（残存価額ゼロ、耐用年数5年）により減価償却を行った。記帳方法は間接法による。", "options": ["減価償却費", "備品", "固定資産圧縮損", "備品減価償却累計額", "未払金", "当座預金", "保険差益"], "debit": [{"branch": "main", "account": "減価償却費", "amount": 140000}], "credit": [{"branch": "main", "account": "備品減価償却累計額", "amount": 140000}], "explanation": "圧縮記帳後の帳簿価額700,000円÷耐用年数5年＝140,000円。", "section": "第1問対策"}, {"id": "J2-040", "category": "リース取引", "subcategory": "ファイナンス・リース／利子抜き法・契約時", "difficulty": 3, "question": "北海道商事株式会社は、当期首において下記の条件によって根室リース株式会社とコピー機のリース契約（ファイナンス・リース取引に該当する）を結んだ。なお、リース料に含まれている利息は毎期均等額を費用として処理する方法（利子抜き法）で処理すること。リース期間：5年間、リース料年額：￥90,000（毎年3月末日払い）、リース資産：見積現金購入価額￥375,000。", "options": ["現金", "支払リース料", "リース資産", "リース債務", "未払金", "支払利息", "未収入金"], "debit": [{"branch": "main", "account": "リース資産", "amount": 375000}], "credit": [{"branch": "main", "account": "リース債務", "amount": 375000}], "explanation": "利子抜き法では契約時に見積現金購入価額でリース資産とリース債務を計上する。感覚的には『リース資産＝備品』『リース債務＝未払金』。", "section": "第1問対策"}, {"id": "J2-041", "category": "リース取引", "subcategory": "ファイナンス・リース／利子抜き法・支払と減価償却", "difficulty": 4, "question": "北海道商事株式会社は、3月31日において、1回目のリース料を上記1.の条件どおりに小切手を振り出して支払った。また、本日決算日につき、コピー機は耐用年数5年、残存価額をゼロとして定額法で減価償却を行う（記帳方法は間接法）。", "options": ["支払利息", "リース資産", "リース債務", "減価償却費", "当座預金", "リース資産減価償却累計額", "未払金"], "debit": [{"branch": "main", "account": "リース債務", "amount": 75000}, {"branch": "main", "account": "支払利息", "amount": 15000}, {"branch": "main", "account": "減価償却費", "amount": 75000}], "credit": [{"branch": "main", "account": "当座預金", "amount": 90000}, {"branch": "main", "account": "リース資産減価償却累計額", "amount": 75000}], "explanation": "総リース料450,000円－見積現金購入価額375,000円＝利息総額75,000円。5年で均等に15,000円ずつ。元本返済は90,000－15,000＝75,000円。減価償却も375,000÷5年＝75,000円。", "section": "第1問対策"}, {"id": "J2-042", "category": "リース取引", "subcategory": "ファイナンス・リース／利子込み法", "difficulty": 4, "question": "高知商業株式会社は、当期首において、リース会社とリース期間5年、リース料は年額￥100,000（期末に当座預金口座より後払い）で複合機（見積現金購入価額は￥460,000）のリース契約を結んだ。このリース契約はファイナンス・リース取引に該当し、利子込み法で処理している。当期末における第1回目のリース料支払いと減価償却の仕訳をしなさい。なお、減価償却は耐用年数5年、残存価額ゼロとする定額法（記帳方法は間接法）によって行うこと。", "options": ["車両運搬具", "リース資産", "リース債務", "支払利息", "当座預金", "減価償却費", "リース資産減価償却累計額"], "debit": [{"branch": "main", "account": "リース債務", "amount": 100000}, {"branch": "main", "account": "減価償却費", "amount": 100000}], "credit": [{"branch": "main", "account": "当座預金", "amount": 100000}, {"branch": "main", "account": "リース資産減価償却累計額", "amount": 100000}], "explanation": "利子込み法では総リース料500,000円をリース資産・リース債務として扱うため、1回の支払い100,000円を全額リース債務の減少とする。減価償却は500,000÷5年＝100,000円。", "section": "第1問対策"}, {"id": "J2-043", "category": "リース取引", "subcategory": "ファイナンス・リース／途中解約・除却", "difficulty": 5, "question": "×2年4月1日から、ファイナンス・リース取引に該当する事務機器のリース契約（期間は×7年3月31日までの5年間、月額リース料は￥35,000で毎月末日支払い）を結び、利子込み法により処理してきたが、×5年3月31日でこのリース契約を解約して×5年4月1日以降の未払リース料の残高全額を普通預金口座から支払い、同時にこのリース物件を貸し手に無償で返却し、除却の処理をした。なお、このリース物件について×5年3月31日まで減価償却費を間接法により計上済みである。", "options": ["リース資産", "リース資産減価償却累計額", "固定資産除却損", "普通預金", "リース債務", "固定資産売却損", "当座預金"], "debit": [{"branch": "main", "account": "リース債務", "amount": 840000}, {"branch": "main", "account": "リース資産減価償却累計額", "amount": 1260000}, {"branch": "main", "account": "固定資産除却損", "amount": 840000}], "credit": [{"branch": "main", "account": "普通預金", "amount": 840000}, {"branch": "main", "account": "リース資産", "amount": 2100000}], "explanation": "月額35,000円×60か月＝リース資産2,100,000円。36か月分償却済みなので累計額1,260,000円、残存帳簿価額840,000円を除却損。残り24か月分のリース債務840,000円も一括支払いする。", "section": "第1問対策"}, {"id": "J2-044", "category": "リース取引", "subcategory": "オペレーティング・リース", "difficulty": 2, "question": "×2年8月31日、青森株式会社は、下記の条件によって岩手リース株式会社と結んだ備品のリース契約（オペレーティング・リース取引に該当する）につき、1回目のリース料を現金で支払った。リース契約日：×1年9月1日、リース期間：4年間、リース料：年額￥20,000（支払日は毎年8月末日）。", "options": ["支払利息", "リース資産", "減価償却費", "支払リース料", "リース債務", "現金", "当座預金"], "debit": [{"branch": "main", "account": "支払リース料", "amount": 20000}], "credit": [{"branch": "main", "account": "現金", "amount": 20000}], "explanation": "オペレーティング・リース取引では、支払ったリース料をそのまま支払リース料として費用処理する。", "section": "第1問対策"}, {"id": "J2-045", "category": "研究開発費・無形固定資産", "subcategory": "研究開発専用器具", "difficulty": 2, "question": "もっぱら研究・開発のために使用する器具を￥100,000で購入し、代金は小切手を振り出して支払った。", "options": ["支払利息", "ソフトウェア", "研究開発費", "ソフトウェア仮勘定", "ソフトウェア償却", "当座預金", "備品"], "debit": [{"branch": "main", "account": "研究開発費", "amount": 100000}], "credit": [{"branch": "main", "account": "当座預金", "amount": 100000}], "explanation": "研究開発のためだけに使用する器具の取得支出は、備品ではなく研究開発費として当期費用処理する。", "section": "第1問対策"}, {"id": "J2-046", "category": "研究開発費・無形固定資産", "subcategory": "自社利用ソフトウェア取得", "difficulty": 2, "question": "富士商事株式会社は、将来の経費削減に確実に役立つので、自社利用目的でソフトウェア￥150,000を購入し、代金は小切手を振り出して支払った。", "options": ["ソフトウェア償却", "当座預金", "ソフトウェア仮勘定", "減価償却費", "ソフトウェア", "研究開発費", "未払金"], "debit": [{"branch": "main", "account": "ソフトウェア", "amount": 150000}], "credit": [{"branch": "main", "account": "当座預金", "amount": 150000}], "explanation": "将来の収益獲得または費用削減が確実な自社利用ソフトウェアは、無形固定資産のソフトウェアとして計上する。", "section": "第1問対策"}, {"id": "J2-047", "category": "研究開発費・無形固定資産", "subcategory": "ソフトウェア償却", "difficulty": 2, "question": "静岡商事は、決算にあたり当期首に自社利用目的で購入したソフトウェア（取得原価￥250,000）について定額法により償却した。なお、このソフトウェアの利用可能期間は5年と見積もられている。", "options": ["ソフトウェア", "当座預金", "ソフトウェア償却", "ソフトウェア仮勘定", "研究開発費", "のれん償却", "特許権"], "debit": [{"branch": "main", "account": "ソフトウェア償却", "amount": 50000}], "credit": [{"branch": "main", "account": "ソフトウェア", "amount": 50000}], "explanation": "250,000円÷5年＝50,000円。ソフトウェアは直接法で償却し、貸方はソフトウェア。", "section": "第1問対策"}, {"id": "J2-048", "category": "研究開発費・無形固定資産", "subcategory": "ソフトウェア仮勘定から振替", "difficulty": 3, "question": "社内利用目的のソフトウェアの開発を外部に依頼し、3回均等分割払いの条件で契約総額￥900,000の全額を未払計上し、2回分をすでに支払っていた。本日、このソフトウェアの制作が完成し、使用を開始したため、ソフトウェアの勘定に振り替えるとともに、最終回（第3回目）の支払いを普通預金から行った。", "options": ["普通預金", "ソフトウェア償却", "ソフトウェア仮勘定", "ソフトウェア", "研究開発費", "未払金", "現金"], "debit": [{"branch": "main", "account": "ソフトウェア", "amount": 900000}, {"branch": "main", "account": "未払金", "amount": 300000}], "credit": [{"branch": "main", "account": "ソフトウェア仮勘定", "amount": 900000}, {"branch": "main", "account": "普通預金", "amount": 300000}], "explanation": "開発中に計上していたソフトウェア仮勘定900,000円を、完成・使用開始時にソフトウェアへ振り替える。残り1回分300,000円の未払金を普通預金で支払う。", "section": "第1問対策"}, {"id": "J2-049", "category": "引当金", "subcategory": "貸倒引当金・個別評価と実績率", "difficulty": 4, "question": "決算日における売掛金残高は￥1,000,000、電子記録債権残高は￥1,200,000、貸付金残高は￥1,200,000であった。売掛金と電子記録債権については過去の貸倒実績率2％によって貸倒引当金を設定するが、貸付金については、債務者の財政状態が悪化しているため、その回収可能額を50％と見積もって貸倒引当金を設定する。なお、決算整理前残高試算表の貸倒引当金は￥25,000である。", "options": ["償却債権取立益", "売掛金", "貸倒引当金繰入", "貸倒損失", "電子記録債権", "貸倒引当金", "受取手形"], "debit": [{"branch": "main", "account": "貸倒引当金繰入", "amount": 619000}], "credit": [{"branch": "main", "account": "貸倒引当金", "amount": 619000}], "explanation": "売掛金・電子記録債権：(1,000,000＋1,200,000)×2%=44,000円。貸付金：1,200,000×50%=600,000円。必要残高644,000円から既存25,000円を差し引き、619,000円を繰り入れる。", "section": "第1問対策"}, {"id": "J2-050", "category": "引当金", "subcategory": "貸倒処理・前期債権と当期債権", "difficulty": 3, "question": "得意先が倒産し、同社に対する売掛金￥500,000が回収不能となったため、貸倒れとして処理する。なお、回収不能額の売掛金のうち、￥350,000は前期に発生したもので、残額は当期に発生したものである。また、貸倒引当金の残高は￥400,000である。", "options": ["貸倒引当金", "貸倒損失", "受取手形", "償却債権取立益", "貸倒引当金繰入", "売掛金", "売上"], "debit": [{"branch": "main", "account": "貸倒引当金", "amount": 350000}, {"branch": "main", "account": "貸倒損失", "amount": 150000}], "credit": [{"branch": "main", "account": "売掛金", "amount": 500000}], "explanation": "前期発生分350,000円は貸倒引当金を取り崩す。当期発生分150,000円は貸倒損失として当期費用処理する。", "section": "第1問対策"}, {"id": "J2-051", "category": "引当金", "subcategory": "修繕引当金の取崩し", "difficulty": 2, "question": "機械および設備の定期修繕を行い、代金￥750,000は翌月末に支払うこととした。なお、修繕引当金の残高は￥450,000である。", "options": ["修繕費", "未収入金", "修繕引当金", "未払金", "機械設備", "減価償却費", "修繕引当金繰入"], "debit": [{"branch": "main", "account": "修繕引当金", "amount": 450000}, {"branch": "main", "account": "修繕費", "amount": 300000}], "credit": [{"branch": "main", "account": "未払金", "amount": 750000}], "explanation": "修繕引当金450,000円を取り崩し、不足分300,000円を修繕費として処理する。", "section": "第1問対策"}, {"id": "J2-052", "category": "引当金", "subcategory": "役員賞与引当金の設定", "difficulty": 2, "question": "決算につき、役員賞与引当金￥800,000を設定する。", "options": ["賞与引当金", "所得税預り金", "当座預金", "給料", "役員賞与引当金繰入", "役員賞与引当金", "従業員立替金"], "debit": [{"branch": "main", "account": "役員賞与引当金繰入", "amount": 800000}], "credit": [{"branch": "main", "account": "役員賞与引当金", "amount": 800000}], "explanation": "決算時に見積もった役員賞与を、役員賞与引当金繰入として費用計上し、同額の引当金を設定する。", "section": "第1問対策"}, {"id": "J2-053", "category": "引当金", "subcategory": "賞与支給・賞与引当金取崩し", "difficulty": 3, "question": "6月10日、従業員の賞与￥2,400,000（前期末に賞与引当金￥1,600,000を設定している）について、源泉所得税￥360,000を差し引いた残額を当座預金口座から従業員の普通預金口座に振り込んだ。", "options": ["賞与引当金", "当座預金", "賞与", "給料", "所得税預り金", "賞与引当金繰入", "普通預金"], "debit": [{"branch": "main", "account": "賞与引当金", "amount": 1600000}, {"branch": "main", "account": "賞与", "amount": 800000}], "credit": [{"branch": "main", "account": "所得税預り金", "amount": 360000}, {"branch": "main", "account": "当座預金", "amount": 2040000}], "explanation": "賞与総額2,400,000円のうち前期末設定済み1,600,000円は引当金を取り崩し、不足800,000円を賞与として費用処理。源泉所得税360,000円を預り金とし、差額2,040,000円を支払う。", "section": "第1問対策"}, {"id": "J2-054", "category": "引当金", "subcategory": "商品保証引当金の使用", "difficulty": 2, "question": "前期に販売した商品について、修理の申し出があったため、無償修理に応じ、修理業者に修理費用￥250,000を現金で支払った。なお、商品保証引当金の残高は￥300,000である。", "options": ["修繕費", "商品保証引当金繰入", "商品保証引当金", "現金", "普通預金", "支払手数料", "未払金"], "debit": [{"branch": "main", "account": "商品保証引当金", "amount": 250000}], "credit": [{"branch": "main", "account": "現金", "amount": 250000}], "explanation": "前期販売分に対して設定済みの商品保証引当金があるため、実際の保証修理時には引当金を取り崩す。", "section": "第1問対策"}, {"id": "J2-055", "category": "引当金", "subcategory": "商品保証引当金・洗替法", "difficulty": 4, "question": "決算において、前年度に販売した商品の品質保証期限が終了したため、この保証のために設定した引当金（残高￥40,000）を取り崩すとともに、当期に販売した商品（保証付き）の保証費用（当期の売上高￥3,000,000に対して1％）を見積もり、洗替法により引当金を設定した。", "options": ["商品保証費", "商品保証引当金繰入", "売上", "商品保証引当金", "受取手数料", "商品保証引当金戻入", "売掛金"], "debit": [{"branch": "main", "account": "商品保証引当金", "amount": 40000}, {"branch": "main", "account": "商品保証引当金繰入", "amount": 30000}], "credit": [{"branch": "main", "account": "商品保証引当金戻入", "amount": 40000}, {"branch": "main", "account": "商品保証引当金", "amount": 30000}], "explanation": "洗替法なので、まず前期分の引当金40,000円を全額戻し入れ、その後、当期売上3,000,000円×1%=30,000円を新たに設定する。", "section": "第1問対策"}, {"id": "J2-056", "category": "サービス業", "subcategory": "役務提供前の費用発生", "difficulty": 2, "question": "建築物の設計を請け負っている三崎設計事務所は、給料￥200,000と出張旅費￥100,000を現金で支払った。", "options": ["給料", "現金", "旅費交通費", "前払金", "仕掛品", "役務収益", "役務原価"], "debit": [{"branch": "main", "account": "給料", "amount": 200000}, {"branch": "main", "account": "旅費交通費", "amount": 100000}], "credit": [{"branch": "main", "account": "現金", "amount": 300000}], "explanation": "まず通常どおり給料と旅費交通費を費用計上する。後で特定案件に直接対応する分が判明した場合は仕掛品へ振り替える。", "section": "第1問対策"}, {"id": "J2-057", "category": "サービス業", "subcategory": "直接費の仕掛品振替", "difficulty": 3, "question": "三崎設計事務所は、顧客から依頼のあった案件について建物の設計を行った。上記1.の給料のうち￥120,000と出張旅費のうち￥30,000が当該案件のために直接費やされたものであることが明らかになったため、これらを仕掛品勘定に振り替えた。", "options": ["現金", "前払金", "仕掛品", "給料", "役務原価", "旅費交通費", "役務収益"], "debit": [{"branch": "main", "account": "仕掛品", "amount": 150000}], "credit": [{"branch": "main", "account": "給料", "amount": 120000}, {"branch": "main", "account": "旅費交通費", "amount": 30000}], "explanation": "特定案件に直接対応する原価が判明したため、給料120,000円と旅費30,000円を仕掛品へ振り替える。", "section": "第1問対策"}, {"id": "J2-058", "category": "サービス業", "subcategory": "役務収益と役務原価", "difficulty": 3, "question": "三崎設計事務所は、上記2.の案件について、設計図が完成したので、これを顧客に渡し、その対価￥280,000を受け取り、当座預金口座に入金した。役務収益の発生に伴い、対応する役務原価を計上する。", "options": ["役務原価", "当座預金", "前受金", "前払金", "仕掛品", "役務収益", "未収入金"], "debit": [{"branch": "main", "account": "当座預金", "amount": 280000}, {"branch": "main", "account": "役務原価", "amount": 150000}], "credit": [{"branch": "main", "account": "役務収益", "amount": 280000}, {"branch": "main", "account": "仕掛品", "amount": 150000}], "explanation": "役務が完了したため収益280,000円を認識し、対応する仕掛品150,000円を役務原価へ振り替える。", "section": "第1問対策"}, {"id": "J2-059", "category": "サービス業", "subcategory": "前受金の収益振替と役務原価", "difficulty": 3, "question": "旅行業を営む水道橋旅行株式会社は、×1年10月25日に3泊4日のツアーを催行し、移動のための交通費や添乗員への報酬など、￥500,000を現金で支払った。なお、このツアーに関し、×1年8月25日に申込金￥1,000,000を現金で受け取っている。", "options": ["仕掛品", "現金", "前受金", "前払金", "役務原価", "役務収益", "当座預金"], "debit": [{"branch": "main", "account": "前受金", "amount": 1000000}, {"branch": "main", "account": "役務原価", "amount": 500000}], "credit": [{"branch": "main", "account": "役務収益", "amount": 1000000}, {"branch": "main", "account": "現金", "amount": 500000}], "explanation": "ツアー催行により役務提供が完了したため、事前に受け取っていた前受金1,000,000円を役務収益へ振り替える。同時に当該役務に要した500,000円を役務原価として処理する。", "section": "第1問対策"}, {"id": "J2-060", "category": "収益認識", "subcategory": "商品販売＋保守サービス（契約負債）", "difficulty": 4, "question": "【連続問題：1・2を1問扱い】\n① ×1年4月1日（期首）に、当社は富山商事と商品の販売（×1年4月1日に商品の引き渡しを行う）と、2年間の保守サービスの提供（保守サービスの期間は×1年4月1日から×3年3月31日まで）を1つの契約で締結した。契約書に記載された対価の額は￥3,000,000（商品の対価は￥2,000,000、保守サービスの対価は￥1,000,000）で、商品の引渡時に対価￥3,000,000が普通預金口座に入金された。この場合において、×1年4月1日の仕訳をしなさい。\n② 上記①について、×2年3月31日（決算日）の仕訳をしなさい。", "options": ["当座預金", "普通預金", "契約資産", "契約負債", "売上", "返金負債", "売掛金"], "debit": [{"branch": "①", "account": "普通預金", "amount": 3000000}, {"branch": "②", "account": "契約負債", "amount": 500000}], "credit": [{"branch": "①", "account": "売上", "amount": 2000000}, {"branch": "①", "account": "契約負債", "amount": 1000000}, {"branch": "②", "account": "売上", "amount": 500000}], "explanation": "商品の引渡し分2,000,000円は即時に売上計上し、未提供の保守サービス1,000,000円は契約負債。保守期間2年のうち1年経過した決算日に500,000円を契約負債から売上へ振り替える。①②をまとめて1問として採点する。", "section": "第1問対策"}, {"id": "J2-061", "category": "収益認識", "subcategory": "契約資産から売掛金への振替", "difficulty": 4, "question": "【連続問題：3・4を1問扱い】\n① ×2年4月1日（期首）に、神奈川商事と商品A（対価￥400,000、商品の引渡日は×2年4月30日）および商品B（対価￥250,000、商品の引渡日は×2年5月25日）を販売する契約を締結した。なお、契約書には商品Aの対価の支払いは商品Bの引き渡しが完了するまで留保される旨の記載がある（商品Aと商品Bの両方の引き渡しが完了するまで、対価に関する無条件の権利はない）。×2年4月30日に商品Aを引き渡したときの仕訳をしなさい。\n② 上記①において、×2年5月25日に商品Bを引き渡したときの仕訳をしなさい。なお、商品Aおよび商品Bの代金は×2年6月30日に普通預金口座に振り込まれることになっている。", "options": ["売掛金", "売上", "契約負債", "契約資産", "未収入金", "返金負債", "普通預金", "当座預金"], "debit": [{"branch": "①", "account": "契約資産", "amount": 400000}, {"branch": "②", "account": "売掛金", "amount": 650000}], "credit": [{"branch": "①", "account": "売上", "amount": 400000}, {"branch": "②", "account": "売上", "amount": 250000}, {"branch": "②", "account": "契約資産", "amount": 400000}], "explanation": "商品A引渡時は商品Bの引渡し完了まで対価を請求できず、無条件の権利ではないため契約資産を計上。商品B引渡時に両商品の対価650,000円が無条件の債権となるため売掛金を計上し、商品A分の契約資産400,000円を取り崩す。①②をまとめて1問として採点する。", "section": "第1問対策"}, {"id": "J2-062", "category": "収益認識", "subcategory": "変動対価・リベート（返金負債）", "difficulty": 3, "question": "当期首において、東西株式会社に商品Xを300個売り上げた。販売代金は翌月末日に普通預金口座に入金される。商品Xの販売単価は＠￥2,000であるが、当期中の東西株式会社に対する商品Xの販売個数が800個に達した場合には1個あたり￥20のリベートを支払うことになっている。当期における東西株式会社に対する商品Xの販売個数は900個と予想されており、リベートを支払う可能性は高い。", "options": ["契約資産", "普通預金", "返金負債", "契約負債", "売上", "売掛金", "当座預金"], "debit": [{"branch": "main", "account": "売掛金", "amount": 600000}], "credit": [{"branch": "main", "account": "売上", "amount": 594000}, {"branch": "main", "account": "返金負債", "amount": 6000}], "explanation": "売掛金は300個×2,000円＝600,000円。リベート支払いの可能性が高いため、300個×20円＝6,000円を返金負債として見積もり、売上は594,000円とする。", "section": "第1問対策"}, {"id": "J2-063", "category": "本支店会計", "subcategory": "支店分散計算制度・支店間取引", "difficulty": 3, "question": "近畿産業株式会社の大阪支店は、京都支店より大阪支店負担の広告宣伝費￥120,000を立替払いした旨の連絡を受けた。なお、同社は支店分散計算制度を採用している。", "options": ["広告宣伝費", "本店", "大阪支店", "未払金", "京都支店", "買掛金", "立替金"], "debit": [{"branch": "main", "account": "広告宣伝費", "amount": 120000}], "credit": [{"branch": "main", "account": "京都支店", "amount": 120000}], "explanation": "支店分散計算制度では支店間取引を相手支店勘定で直接処理する。大阪支店負担の広告宣伝費を京都支店が立替えたため、大阪支店側では広告宣伝費を計上し、京都支店勘定を貸方に計上する。", "section": "第1問対策"}, {"id": "J2-064", "category": "本支店会計", "subcategory": "本店集中計算制度・支店間取引", "difficulty": 3, "question": "東京商事株式会社は横浜支店と松戸支店の2つの支店を有しており、本店集中計算制度により会計処理を行っている。この場合に、横浜支店が、松戸支店の広告宣伝費￥150,000を現金で支払った取引について、本店で行われる仕訳を示しなさい。", "options": ["未払金", "現金", "横浜支店", "松戸支店", "本店", "広告宣伝費", "立替金"], "debit": [{"branch": "main", "account": "松戸支店", "amount": 150000}], "credit": [{"branch": "main", "account": "横浜支店", "amount": 150000}], "explanation": "本店集中計算制度では支店間取引を本店に集中させる。本店では費用そのものではなく、負担する松戸支店を借方、立替えた横浜支店を貸方として処理する。", "section": "第1問対策"}, {"id": "J2-065", "category": "本支店会計", "subcategory": "支店独立会計制度・支店開設", "difficulty": 4, "question": "埼玉に支店を開設することになり、本店から現金￥100,000、商品（原価￥800,000、売価￥1,200,000）、備品（取得価額￥500,000、減価償却累計額￥100,000）が移管された。支店独立会計制度を採用している場合の、支店側の仕訳をしなさい。なお、当社は商品売買について、「商品の販売のつど売上原価勘定に振り替える方法」を採用しており、減価償却の記帳方法は間接法によっている。", "options": ["現金", "仕入", "商品", "備品", "備品減価償却累計額", "本店", "売上原価"], "debit": [{"branch": "main", "account": "現金", "amount": 100000}, {"branch": "main", "account": "商品", "amount": 800000}, {"branch": "main", "account": "備品", "amount": 500000}], "credit": [{"branch": "main", "account": "備品減価償却累計額", "amount": 100000}, {"branch": "main", "account": "本店", "amount": 1300000}], "explanation": "支店側では移管された資産をそのまま引き継ぐ。商品は原価800,000円、備品は取得原価500,000円と累計額100,000円を引き継ぎ、差額1,300,000円を本店勘定で処理する。", "section": "第1問対策"}, {"id": "J2-066", "category": "本支店会計", "subcategory": "支店独立会計制度・支店利益の振替", "difficulty": 2, "question": "決算にあたり、本店は支店から当期純利益￥870,000を計上したとの報告を受けた。本店側の仕訳を答えなさい。なお、当社は支店独立会計制度を採用している。", "options": ["損益", "繰越利益剰余金", "本店", "支店", "資本金", "法人税、住民税及び事業税"], "debit": [{"branch": "main", "account": "支店", "amount": 870000}], "credit": [{"branch": "main", "account": "損益", "amount": 870000}], "explanation": "支店が利益を計上すると本店側の支店勘定が増加するため、支店勘定を借方、損益勘定を貸方に計上する。", "section": "第1問対策"}, {"id": "J2-067", "category": "税効果会計", "subcategory": "貸倒引当金・損金不算入", "difficulty": 4, "question": "決算において、売掛金に対して貸倒引当金を￥100,000計上したが、そのうち￥40,000は税法上損金に算入することが認められなかった。貸倒引当金を設定する仕訳と税効果に関する仕訳を示しなさい。なお、法人税等の実効税率は30％とする。また、決算整理前の貸倒引当金の残高はゼロである。", "options": ["繰延税金負債", "法人税等調整額", "貸倒引当金", "法人税、住民税及び事業税", "貸倒引当金繰入", "繰延税金資産", "繰越利益剰余金"], "debit": [{"branch": "main", "account": "貸倒引当金繰入", "amount": 100000}, {"branch": "main", "account": "繰延税金資産", "amount": 12000}], "credit": [{"branch": "main", "account": "貸倒引当金", "amount": 100000}, {"branch": "main", "account": "法人税等調整額", "amount": 12000}], "explanation": "貸倒引当金100,000円を計上。うち損金不算入40,000円は将来減算一時差異となるため、40,000×30%=12,000円の繰延税金資産を計上する。", "section": "第1問対策"}, {"id": "J2-068", "category": "税効果会計", "subcategory": "減価償却超過額・損金不算入", "difficulty": 4, "question": "決算にあたり、当期首に取得した備品（取得原価￥480,000、残存価額ゼロ、耐用年数4年）について、定額法により減価償却を行った。なお、税法で認められている耐用年数は6年であるために、税法で認められる償却額を超過した部分については損金に算入することが認められない。よって税効果に関する仕訳を示しなさい。なお、法人税等の実効税率は30％とし、減価償却に関する仕訳は不要である。", "options": ["法人税等調整額", "繰延税金負債", "法人税、住民税及び事業税", "未払法人税等", "仮払法人税等", "繰延税金資産", "租税公課"], "debit": [{"branch": "main", "account": "繰延税金資産", "amount": 12000}], "credit": [{"branch": "main", "account": "法人税等調整額", "amount": 12000}], "explanation": "会計上の減価償却費は480,000÷4=120,000円、税務上は480,000÷6=80,000円。差額40,000円が損金不算入となり、40,000×30%=12,000円の繰延税金資産を計上する。", "section": "第1問対策"}, {"id": "J2-069", "category": "税効果会計", "subcategory": "その他有価証券評価差額・全部純資産直入法", "difficulty": 5, "question": "決算において、その他有価証券として保有する岩手商事株式会社の株式500株（1株あたりの帳簿価額￥2,000）を全部純資産直入法にもとづき1株につき￥2,400に評価替えする。税効果会計を適用し、法定実効税率は30％とする。", "options": ["法人税等調整額", "その他有価証券", "法人税、住民税及び事業税", "その他有価証券評価差額金", "繰延税金資産", "有価証券評価益", "繰延税金負債"], "debit": [{"branch": "main", "account": "その他有価証券", "amount": 200000}], "credit": [{"branch": "main", "account": "繰延税金負債", "amount": 60000}, {"branch": "main", "account": "その他有価証券評価差額金", "amount": 140000}], "explanation": "評価差額は（2,400−2,000）×500株=200,000円。将来加算一時差異なので200,000×30%=60,000円の繰延税金負債を計上し、残額140,000円をその他有価証券評価差額金とする。", "section": "第1問対策"}, {"id": "J2-070", "category": "連結会計", "subcategory": "支配獲得日・投資と資本の相殺消去", "difficulty": 5, "question": "P社は×1年3月31日（決算日）に、S社の発行済株式の60％を￥950,000で取得して支配を獲得した。×1年3月31日におけるS社の純資産は、資本金￥1,000,000、資本剰余金￥200,000、利益剰余金￥300,000であった。支配獲得日における連結貸借対照表を作成するために必要な連結修正仕訳を示しなさい。", "options": ["利益剰余金", "子会社株式", "非支配株主持分", "のれん", "資本金", "資本剰余金", "負ののれん発生益"], "debit": [{"branch": "main", "account": "資本金", "amount": 1000000}, {"branch": "main", "account": "資本剰余金", "amount": 200000}, {"branch": "main", "account": "利益剰余金", "amount": 300000}, {"branch": "main", "account": "のれん", "amount": 50000}], "credit": [{"branch": "main", "account": "子会社株式", "amount": 950000}, {"branch": "main", "account": "非支配株主持分", "amount": 600000}], "explanation": "S社純資産は1,500,000円。非支配株主持分は40％なので600,000円。親会社持分60％は900,000円で、取得原価950,000円との差額50,000円がのれん。", "section": "第1問対策"}, {"id": "J2-071", "category": "連結会計", "subcategory": "ダウンストリーム・未実現利益消去", "difficulty": 4, "question": "P社は×1年3月31日に、S社の発行済株式の70％を取得し、支配を獲得している。P社は連結第1年度（×1年4月1日から×2年3月31日）より、S社に対し、原価に10％の利益を加算して商品を販売している。連結第1年度末におけるS社の期末商品のうち、￥220,000はP社から仕入れたものであった。連結第1年度の連結財務諸表を作成するのに必要な未実現利益を控除するための連結修正仕訳を示しなさい。", "options": ["商品", "非支配株主持分", "売上原価", "利益剰余金", "資本金", "非支配株主に帰属する当期純損益", "資本剰余金"], "debit": [{"branch": "main", "account": "売上原価", "amount": 20000}], "credit": [{"branch": "main", "account": "商品", "amount": 20000}], "explanation": "原価に10％利益を加算しているため、売価220,000円に含まれる利益は220,000×10/110＝20,000円。親会社→子会社のダウンストリームなので、未実現利益20,000円を売上原価増加・商品減少で消去し、非支配株主持分の修正は不要。", "section": "第1問対策"}, {"id": "J2-072", "category": "連結会計", "subcategory": "アップストリーム・未実現利益消去", "difficulty": 5, "question": "P社は×1年3月31日に、S社の発行済株式の60％を取得し、支配を獲得している。S社は連結第1年度（×1年4月1日から×2年3月31日）より、P社に対し、原価に10％の利益を加算して商品を販売している。連結第1年度末におけるP社の期末商品のうち、￥330,000はS社から仕入れたものであった。連結第1年度の連結財務諸表を作成するのに必要な未実現利益を控除するための連結修正仕訳を示しなさい。", "options": ["非支配株主持分", "非支配株主に帰属する当期純損益", "商品", "売上高", "売上原価", "買掛金"], "debit": [{"branch": "main", "account": "売上原価", "amount": 30000}, {"branch": "main", "account": "非支配株主持分", "amount": 12000}], "credit": [{"branch": "main", "account": "商品", "amount": 30000}, {"branch": "main", "account": "非支配株主に帰属する当期純損益", "amount": 12000}], "explanation": "売価330,000円に含まれる未実現利益は330,000×10/110＝30,000円。子会社→親会社のアップストリームなので、未実現利益を消去したうえで非支配株主40％分の12,000円（30,000×40％）も調整する。", "section": "第1問対策"}, {"id": "J2-073", "category": "工業簿記", "subcategory": "材料購入・材料副費予定配賦", "difficulty": 3, "question": "当社は素材A500kgを1,000円/kgで購入し、代金は掛けとした。なお、購入に際して、購入代価の4％を材料副費として予定配賦した。", "options": ["材料", "買掛金", "材料副費", "当座預金", "仕掛品", "製品"], "debit": [{"branch": "main", "account": "材料", "amount": 520000}], "credit": [{"branch": "main", "account": "買掛金", "amount": 500000}, {"branch": "main", "account": "材料副費", "amount": 20000}], "explanation": "購入代価は500kg×1,000円＝500,000円。材料副費予定配賦額は500,000×4％＝20,000円。材料の取得原価は合計520,000円。", "section": "第4問対策"}, {"id": "J2-074", "category": "工業簿記", "subcategory": "材料副費差異", "difficulty": 3, "question": "当月の材料副費の実際発生額は￥38,000であった。なお、当月中の材料副費の予定配賦額は￥40,000であったため、予定配賦額と実際発生額との差額を材料副費差異勘定に振り替える。", "options": ["製造間接費", "仕掛品", "材料副費", "材料", "消費価格差異", "材料副費差異"], "debit": [{"branch": "main", "account": "材料副費", "amount": 2000}], "credit": [{"branch": "main", "account": "材料副費差異", "amount": 2000}], "explanation": "予定配賦40,000円に対して実際発生38,000円なので2,000円の有利差異。材料副費勘定の貸方残を借方へ振り替え、材料副費差異を貸方に計上する。", "section": "第4問対策"}, {"id": "J2-075", "category": "工業簿記", "subcategory": "材料消費価格差異・先入先出法", "difficulty": 4, "question": "当月の消費価格差異を計上する。材料の予定消費価格は＠500円であり、実際消費額の計算は先入先出法によっている。また、前月繰越高は200個＠480円、当月購入高は300個＠510円、当月消費量は450個であった。", "options": ["材料", "仕掛品", "材料副費", "製品", "消費価格差異", "現金"], "debit": [{"branch": "main", "account": "材料", "amount": 1500}], "credit": [{"branch": "main", "account": "消費価格差異", "amount": 1500}], "explanation": "予定消費額は450個×500円＝225,000円。FIFOによる実際消費額は200個×480円＋250個×510円＝223,500円。予定額の方が1,500円大きいため有利差異となる。", "section": "第4問対策"}, {"id": "J2-076", "category": "工業簿記", "subcategory": "外注加工・無償支給", "difficulty": 3, "question": "当社は素材Bの錆防止のコーティング加工のため、製鉄会社に素材Bを無償で支給していた。本日、加工後の素材Bが納入されたので、その加工賃￥200,000を製鉄会社に現金で支払った。なお、加工後の素材Bは直ちに製造現場に引き渡された。", "options": ["材料", "現金", "製造間接費", "賃金・給料", "製品", "仕掛品"], "debit": [{"branch": "main", "account": "仕掛品", "amount": 200000}], "credit": [{"branch": "main", "account": "現金", "amount": 200000}], "explanation": "無償支給した材料の加工賃は製品の直接原価となるため、加工後すぐ製造現場へ投入した場合は仕掛品に計上する。", "section": "第4問対策"}, {"id": "J2-077", "category": "工業簿記", "subcategory": "賃金・給料の振替", "difficulty": 4, "question": "賃金・給料を仕掛品と製造間接費に振り替える。当月における直接工の実際作業時間のうち、特定の製造指図書にかかる作業時間は1,200時間、それ以外の作業時間は100時間であった。なお、直接工賃金の計算には予定消費賃率＠1,000円/時間を用いている。また、間接工については、当月賃金支払額が300,000円、前月末払額が60,000円、当月末払額が70,000円であった。", "options": ["賃金・給料", "仕掛品", "製造間接費", "賃率差異", "未払賃金", "製品"], "debit": [{"branch": "main", "account": "仕掛品", "amount": 1200000}, {"branch": "main", "account": "製造間接費", "amount": 410000}], "credit": [{"branch": "main", "account": "賃金・給料", "amount": 1610000}], "explanation": "直接作業分は1,200時間×1,000円＝1,200,000円を仕掛品へ。直接工の間接作業分は100時間×1,000円＝100,000円。間接工賃金の当月消費額は300,000＋70,000－60,000＝310,000円なので、製造間接費は合計410,000円。", "section": "第4問対策"}, {"id": "J2-078", "category": "工業簿記", "subcategory": "製造間接費配賦差異", "difficulty": 4, "question": "当月の製造間接費配賦差異を計上した。当社は、製造間接費を予定配賦率を用いて各製造指図書に配賦しており、年間の製造間接費の予算は18,000,000円、配賦基準となる年間の直接工の予定直接作業時間は18,000時間である。当月の直接工の直接作業時間は1,400時間であり、当月の製造間接費実際発生額は1,450,000円であった。", "options": ["仕掛品", "製造間接費", "賃金・給料", "消費価格差異", "製造間接費配賦差異", "賃率差異"], "debit": [{"branch": "main", "account": "製造間接費配賦差異", "amount": 50000}], "credit": [{"branch": "main", "account": "製造間接費", "amount": 50000}], "explanation": "予定配賦率は18,000,000÷18,000時間＝1,000円/時間。予定配賦額は1,400時間×1,000円＝1,400,000円。実際発生額1,450,000円との差50,000円は不利差異。", "section": "第4問対策"}, {"id": "J2-079", "category": "工業簿記", "subcategory": "材料消費・直接材料と間接材料", "difficulty": 3, "question": "当社は、当月に素材Cを3,500kg消費した。そのうち、3,000kgは製品製造用として消費し、残りは補修用材料として使用した。なお、素材Cは当月中に4,000kgを800,000円で購入したものである。", "options": ["材料", "仕掛品", "現金", "買掛金", "製造間接費", "製品"], "debit": [{"branch": "main", "account": "仕掛品", "amount": 600000}, {"branch": "main", "account": "製造間接費", "amount": 100000}], "credit": [{"branch": "main", "account": "材料", "amount": 700000}], "explanation": "材料単価は800,000÷4,000kg＝200円/kg。直接材料3,000kgは600,000円を仕掛品へ、補修用500kgは100,000円を製造間接費へ振り替える。", "section": "第4問対策"}, {"id": "J2-080", "category": "工業簿記", "subcategory": "製造間接費予定配賦", "difficulty": 3, "question": "製造間接費を各製造指図書に配賦した。当社は、製造間接費を予定配賦率を用いて各製造指図書に配賦している。なお、年間の製造間接費の予算は22,000,000円、配賦基準となる年間の直接工の予定直接作業時間は11,000時間、当月の直接工の直接作業時間は1,400時間であった。", "options": ["賃金・給料", "製造間接費", "売上原価", "製品", "仕掛品", "材料"], "debit": [{"branch": "main", "account": "仕掛品", "amount": 2800000}], "credit": [{"branch": "main", "account": "製造間接費", "amount": 2800000}], "explanation": "予定配賦率は22,000,000÷11,000時間＝2,000円/時間。当月の予定配賦額は1,400時間×2,000円＝2,800,000円。", "section": "第4問対策"}, {"id": "J2-081", "category": "工業簿記", "subcategory": "工場会計・本社元帳", "difficulty": 4, "question": "【枝問①②をまとめて1問扱い】\n当社は工場を所持しており、本社会計から工場会計を独立させており、照合勘定として本社側においては工場元帳勘定、工場側では本社元帳勘定を用いている。材料の購入は本社で行っているが、材料の倉庫は工場にある。また、製品の倉庫は本社にある。以下の取引において工場で行われる仕訳を示しなさい。\n① 本社が購入した素材D2,900,000円（3,000kg）を工場の倉庫で受け入れた。なお、購入に際して本社は買入部品費100,000円を支払っている。\n② 製品5,000,000円が完成したため、本社の倉庫に搬入した。", "options": ["材料", "本社元帳", "仕掛品", "買掛金", "現金", "材料副費", "製品"], "debit": [{"branch": "①", "account": "材料", "amount": 3000000}, {"branch": "②", "account": "本社元帳", "amount": 5000000}], "credit": [{"branch": "①", "account": "本社元帳", "amount": 3000000}, {"branch": "②", "account": "仕掛品", "amount": 5000000}], "explanation": "① 材料取得原価は購入代価2,900,000円＋買入部品費100,000円＝3,000,000円。工場側では本社元帳を相手勘定とする。② 完成品は本社倉庫へ移されるため、工場側では本社元帳を借方、仕掛品を貸方に計上する。①②をまとめて1問として採点する。", "section": "第4問対策"}, {"id": "J2-082", "category": "工業簿記", "subcategory": "公式法変動予算・予算差異と操業度差異", "difficulty": 5, "question": "製造間接費の予定配賦額と実際発生額の差額を、予算差異勘定と操業度差異勘定に振り替える仕訳を行った。当社の製造間接費予算は変動費＠800円/時間、年間固定費14,400,000円である。また、製造間接費の配賦基準は直接工の直接作業時間を採用しており、年間の予定直接作業時間は12,000時間であり、当月の直接作業時間は980時間であった。なお、製造間接費の配賦には公式法変動予算を採用しており、当月の製造間接費実際発生額は2,040,000円であった。", "options": ["売上原価", "予算差異", "操業度差異", "製造間接費", "仕掛品", "製品"], "debit": [{"branch": "main", "account": "予算差異", "amount": 56000}, {"branch": "main", "account": "操業度差異", "amount": 24000}], "credit": [{"branch": "main", "account": "製造間接費", "amount": 80000}], "explanation": "固定費率は14,400,000÷12,000時間＝1,200円/時間、予定配賦率は800＋1,200＝2,000円/時間。予定配賦額は980×2,000＝1,960,000円。月間固定費予算は1,200,000円、変動予算額は980×800＋1,200,000＝1,984,000円。実際額との差56,000円が予算差異、基準操業度1,000時間と実際980時間の差20時間×固定費率1,200円＝24,000円が操業度差異。", "section": "第4問対策"}];

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
const provider = new firebase.auth.GoogleAuthProvider();

let currentUser = null;
let cloudReady = false;
let syncing = false;

function cloudDocRef(){
  if(!currentUser) return null;
  return db.collection("users").doc(currentUser.uid).collection("app").doc("state");
}

function setSyncBadge(text, mode="normal"){
  const el=document.getElementById("saveBadge");
  if(!el) return;
  el.textContent=text;
  if(mode==="ok"){el.style.background="#dcfce7";el.style.color="#14532d";}
  else if(mode==="busy"){el.style.background="#fef3c7";el.style.color="#92400e";}
  else if(mode==="err"){el.style.background="#fee2e2";el.style.color="#991b1b";}
  else{el.style.background="#e5e7eb";el.style.color="#374151";}
}

async function syncStateToCloud(){
  if(!currentUser || !cloudReady || syncing) return;
  syncing=true;
  setSyncBadge("同期中…","busy");
  try{
    await cloudDocRef().set({
      state: state,
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    }, {merge:true});
    setSyncBadge("クラウド保存済","ok");
  }catch(err){
    console.error(err);
    setSyncBadge("クラウド保存失敗","err");
  }finally{
    syncing=false;
  }
}

async function loadCloudState(){
  if(!currentUser) return;
  setSyncBadge("クラウド読込中…","busy");
  try{
    const snap=await cloudDocRef().get();

    if(snap.exists && snap.data().state){
      const cloudState=snap.data().state;
      const localTime=state?.savedAt ? (Date.parse(state.savedAt)||0) : 0;
      const cloudTime=cloudState?.savedAt ? (Date.parse(cloudState.savedAt)||0) : 0;

      if(cloudTime >= localTime){
        state=cloudState;
        localStorage.setItem(STATE_KEY,JSON.stringify(state));
      }else{
        await cloudDocRef().set({
          state: state,
          updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        }, {merge:true});
      }
    }else{
      await cloudDocRef().set({
        state: state,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      }, {merge:true});
    }

    cloudReady=true;
    renderStats();
    renderResume();
    setSyncBadge("クラウド同期済","ok");
  }catch(err){
    console.error(err);
    cloudReady=false;
    setSyncBadge("同期エラー","err");
    alert("クラウド同期に失敗しました。Firebaseの承認済みドメインとFirestoreルールを確認してください。");
  }
}

let loginInProgress = false;

function isMobileApple(){
  const ua = navigator.userAgent || "";
  const iOS = /iPad|iPhone|iPod/.test(ua);
  const iPadOS = navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1;
  return iOS || iPadOS;
}

async function loginGoogle(){
  if(loginInProgress) return;

  loginInProgress = true;
  const btn = document.getElementById("loginBtn");

  if(btn){
    btn.disabled = true;
    btn.textContent = "ログイン中…";
  }

  try{
    await auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);

    if(isMobileApple()){
      await auth.signInWithRedirect(provider);
      return;
    }

    await auth.signInWithPopup(provider);

  }catch(err){
    console.error(err);

    if(
      isMobileApple() &&
      (
        err?.code === "auth/cancelled-popup-request" ||
        err?.code === "auth/popup-blocked" ||
        err?.code === "auth/popup-closed-by-user"
      )
    ){
      try{
        await auth.signInWithRedirect(provider);
        return;
      }catch(redirectErr){
        console.error(redirectErr);
      }
    }

    alert("Googleログインに失敗しました。\n" + (err.message || err));
  }finally{
    loginInProgress = false;

    if(btn){
      btn.disabled = false;
      btn.textContent = "Googleでログイン";
    }
  }
}

async function logoutGoogle(){
  await auth.signOut();
}


auth.getRedirectResult().catch(err=>{
  console.error("Redirect login error:", err);
  if(err && err.code){
    alert("Googleログインに失敗しました。\n" + (err.message || err.code));
  }
});

auth.onAuthStateChanged(async user=>{
  currentUser=user||null;
  cloudReady=false;

  const loginBtn=document.getElementById("loginBtn");
  const logoutBtn=document.getElementById("logoutBtn");

  if(currentUser){
    loginBtn?.classList.add("hidden");
    logoutBtn?.classList.remove("hidden");

    await loadCloudState();
  }else{
    loginBtn?.classList.remove("hidden");
    logoutBtn?.classList.add("hidden");

  }

const STATE_KEY="boki2_shiwake_autosave_v2";
let state={stats:{},session:null,savedAt:null};
let queue=[],currentIndex=0,graded=false;

function loadState(){
  try{
    const raw=localStorage.getItem(STATE_KEY);
    if(raw) state=Object.assign(state,JSON.parse(raw));
  }catch(e){}
}
function saveState(){
  state.savedAt=new Date().toISOString();
  try{localStorage.setItem(STATE_KEY,JSON.stringify(state));}catch(e){}
  if(currentUser && cloudReady) syncStateToCloud();
  else updateSaveBadge();
}
function updateSaveBadge(){
  if(currentUser && cloudReady) return;
  const el=document.getElementById("saveBadge");
  if(!el) return;
  if(!state.savedAt){setSyncBadge("ローカル保存");return}
  const d=new Date(state.savedAt);
  setSyncBadge("端末保存 "+d.toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit"}));
}
async function requestPersistentStorage(){
  try{
    if(navigator.storage && navigator.storage.persist) await navigator.storage.persist();
  }catch(e){}
}
function qstat(id){return state.stats[id]||{attempts:0,correct:0,last:null,updatedAt:null}}
function renderStats(){
  let a=0,c=0,w=0,u=0;
  QUESTIONS.forEach(q=>{const s=qstat(q.id);a+=s.attempts;c+=s.correct;if(s.last==="wrong")w++;if(!s.attempts)u++});
  document.getElementById("stats").innerHTML=`<div class="stat"><b>${a}</b><span class="small">総回答数</span></div><div class="stat"><b>${a?Math.round(c/a*100):0}%</b><span class="small">総正答率</span></div><div class="stat"><b>${w}</b><span class="small">前回×</span></div><div class="stat"><b>${u}</b><span class="small">未出題</span></div>`;
}
function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function startQuiz(){
  const section=document.getElementById("section").value,mode=document.getElementById("mode").value,count=document.getElementById("count").value;
  let pool=QUESTIONS.filter(q=>section==="ALL"||q.section===section);
  if(mode==="wrong")pool=pool.filter(q=>qstat(q.id).last==="wrong");
  if(mode==="unseen")pool=pool.filter(q=>qstat(q.id).attempts===0);
  if(mode==="weak")pool=[...pool].sort((a,b)=>{
    const A=qstat(a.id),B=qstat(b.id);
    const rank=s=>s.last==="wrong"?0:s.last==="uncertain"?1:s.attempts===0?2:3;
    const ra=rank(A),rb=rank(B);
    if(ra!==rb) return ra-rb;
    const pa=A.attempts?A.correct/A.attempts:1;
    const pb=B.attempts?B.correct/B.attempts:1;
    return pa!==pb?pa-pb:A.attempts-B.attempts;
  });
  else pool=shuffle(pool);
  if(!pool.length){alert("条件に合う問題がありません。");return}
  if(count!=="ALL")pool=pool.slice(0,Math.min(Number(count),pool.length));
  queue=pool;currentIndex=0;
  state.session={ids:queue.map(q=>q.id),index:0,graded:false};
  saveState();
  showQuiz();renderQuestion();
}
function showQuiz(){
  document.getElementById("setup").classList.add("hidden");
  document.getElementById("resumeCard").classList.add("hidden");
  document.getElementById("quiz").classList.remove("hidden");
}
function branchesFor(q){const bs=[];[...q.debit,...q.credit].forEach(e=>{if(!bs.includes(e.branch))bs.push(e.branch)});return bs.length?bs:["main"]}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]))}
function optionHtml(q){return `<option value="">選択してください</option>`+q.options.map(x=>`<option>${esc(x)}</option>`).join("")}
function renderQuestion(){
  graded=false;const q=queue[currentIndex];
  document.getElementById("progress").textContent=`${currentIndex+1} / ${queue.length}`;
  document.getElementById("meta").textContent=`${q.section}｜${q.category}｜難易度 ${q.difficulty}`;
  document.getElementById("qtext").textContent=q.question;
  let h="";
  branchesFor(q).forEach(b=>{
    h+=`<div class="branch" data-branch="${b}"><div class="branch-title">${b==="main"?"仕訳":b+" の仕訳"}</div><div class="journal-grid"><div class="journal-head">借方科目</div><div class="journal-head">金額</div><div class="journal-head credit">貸方科目</div><div class="journal-head credit">金額</div>`;
    for(let i=0;i<4;i++)h+=`<select class="debit-account" data-side="debit" data-branch="${b}">${optionHtml(q)}</select><input class="amount debit-amount" data-side="debit" data-branch="${b}" type="text" inputmode="numeric" pattern="[0-9,]*" autocomplete="off" placeholder="0"
oninput="this.value=this.value.replace(/[^0-9]/g,'').replace(/\B(?=(\d{3})+(?!\d))/g,',')"><select class="credit-account" data-side="credit" data-branch="${b}">${optionHtml(q)}</select><input class="amount credit-amount" data-side="credit" data-branch="${b}" type="text" inputmode="numeric" pattern="[0-9,]*" autocomplete="off" placeholder="0"
oninput="this.value=this.value.replace(/[^0-9]/g,'').replace(/\B(?=(\d{3})+(?!\d))/g,',')">`;
    h+="</div></div>";
  });
  document.getElementById("answerArea").innerHTML=h;
  const r=document.getElementById("result");r.className="result";r.textContent="";
  document.getElementById("gradeBtn").classList.remove("hidden");
  document.getElementById("uncertainBtn").classList.remove("hidden");
  document.getElementById("dontKnowBtn").classList.remove("hidden");
  document.getElementById("nextBtn").classList.add("hidden");
}
function collect(branch,side){
  const p=document.querySelector(`.branch[data-branch="${branch}"]`),sels=[...p.querySelectorAll(`select[data-side="${side}"]`)],amts=[...p.querySelectorAll(`input[data-side="${side}"]`)];
  const out=[];
  sels.forEach((sel,i)=>{const account=sel.value.trim();if(!account)return;if(account==="仕訳なし")out.push({account,amount:null});else {
      const raw=amts[i].value.replace(/,/g,"").replace(/[^0-9]/g,"").trim();
      out.push({account,amount:raw===""?null:Number(raw)})
    }});
  return out;
}
function expected(q,b,side){return q[side].filter(e=>e.branch===b).map(e=>({account:e.account,amount:e.amount}))}
function norm(a){return a.map(x=>`${x.account}@@${x.amount===null?"":Number(x.amount)}`).sort()}
function same(a,b){const A=norm(a),B=norm(b);return A.length===B.length&&A.every((x,i)=>x===B[i])}
function formatExpectedTable(q){
  const money=n=>Number(n).toLocaleString("ja-JP");
  let htmlParts=[];

  for(const b of branchesFor(q)){
    const debits=expected(q,b,"debit");
    const credits=expected(q,b,"credit");

    if(b!=="main"){
      htmlParts.push(`<div class="answer-branch-title">${esc(b)} の正解仕訳</div>`);
    }

    // 「仕訳なし」の問題
    const noEntry =
      (debits.length===1 && debits[0].account==="仕訳なし") ||
      (credits.length===1 && credits[0].account==="仕訳なし");

    if(noEntry){
      htmlParts.push(`<div class="answer-table-wrap"><table class="answer-table">
        <thead><tr><th>借方（左）</th><th>金額（円）</th><th>貸方（右）</th><th>金額（円）</th></tr></thead>
        <tbody><tr><td class="account-cell" colspan="4">仕訳なし</td></tr></tbody>
      </table></div>`);
      continue;
    }

    const rows=Math.max(debits.length,credits.length);
    let body="";

    for(let i=0;i<rows;i++){
      const d=debits[i] || null;
      const c=credits[i] || null;

      body += `<tr>
        <td class="${d?'account-cell':'empty-cell'}">${d ? esc(d.account) : ""}</td>
        <td class="${d?'amount-cell':'empty-cell'}">${d && d.amount!==null ? money(d.amount) : ""}</td>
        <td class="${c?'account-cell':'empty-cell'}">${c ? esc(c.account) : ""}</td>
        <td class="${c?'amount-cell':'empty-cell'}">${c && c.amount!==null ? money(c.amount) : ""}</td>
      </tr>`;
    }

    htmlParts.push(`<div class="answer-table-wrap">
      <table class="answer-table">
        <thead>
          <tr>
            <th>借方（左）</th>
            <th>金額（円）</th>
            <th>貸方（右）</th>
            <th>金額（円）</th>
          </tr>
        </thead>
        <tbody>${body}</tbody>
      </table>
    </div>`);
  }

  return htmlParts.join("");
}

function evaluateCurrentAnswer(){
  const q=queue[currentIndex];
  let ok=true;
  for(const b of branchesFor(q)){
    if(!same(collect(b,"debit"),expected(q,b,"debit"))) ok=false;
    if(!same(collect(b,"credit"),expected(q,b,"credit"))) ok=false;
  }
  return ok;
}

function finishGrading(mode){
  if(graded) return;
  const q=queue[currentIndex];
  const ok = mode==="unknown" ? false : evaluateCurrentAnswer();

  const s=qstat(q.id);
  s.attempts++;
  if(ok) s.correct++;

  if(mode==="unknown"){
    s.last="wrong";
    s.selfRating="unknown";
  }else if(mode==="uncertain"){
    s.last=ok ? "uncertain" : "wrong";
    s.selfRating="uncertain";
  }else{
    s.last=ok ? "correct" : "wrong";
    s.selfRating=ok ? "confident" : "wrong";
  }

  s.updatedAt=new Date().toISOString();
  state.stats[q.id]=s;
  graded=true;
  state.session={ids:queue.map(x=>x.id),index:currentIndex,graded:true};
  saveState();
  renderStats();

  const r=document.getElementById("result");
  let label="", cls="ng";

  if(mode==="unknown"){
    label="× わからない";
  }else if(mode==="uncertain" && ok){
    label="△ 正解。ただし復習対象";
    cls="ok";
  }else if(ok){
    label="○ 正解";
    cls="ok";
  }else{
    label="× 不正解";
  }

  r.className="result "+cls;
  r.innerHTML=`<b>${label}</b>
    <div class="answer">${formatExpectedTable(q)}</div>
    <div class="answer"><b>ポイント</b><br>${esc(q.explanation)}</div>`;

  document.getElementById("gradeBtn").classList.add("hidden");
  document.getElementById("uncertainBtn").classList.add("hidden");
  document.getElementById("dontKnowBtn").classList.add("hidden");
  document.getElementById("nextBtn").classList.remove("hidden");
}

function grade(){finishGrading("normal");}
function gradeUncertain(){finishGrading("uncertain");}
function gradeDontKnow(){finishGrading("unknown");}

function nextQ(){
  if(currentIndex+1>=queue.length){
    state.session=null;saveState();
    alert("このセットは終了です。");
    document.getElementById("quiz").classList.add("hidden");document.getElementById("setup").classList.remove("hidden");renderResume();
    return;
  }
  currentIndex++;
  state.session={ids:queue.map(x=>x.id),index:currentIndex,graded:false};saveState();renderQuestion();
}
function resumeSession(){
  if(!state.session)return;
  queue=state.session.ids.map(id=>QUESTIONS.find(q=>q.id===id)).filter(Boolean);
  currentIndex=Math.min(state.session.index,Math.max(0,queue.length-1));
  showQuiz();renderQuestion();
}
function renderResume(){
  const card=document.getElementById("resumeCard");
  if(!state.session || !state.session.ids || !state.session.ids.length){card.classList.add("hidden");return}
  card.classList.remove("hidden");
  document.getElementById("resumeText").textContent=`${state.session.index+1} / ${state.session.ids.length} 問目から再開できます。`;
}
function backup(){
  const blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="簿記2級_仕訳トレーナー_成績バックアップ.json";a.click();URL.revokeObjectURL(a.href);
}
function restore(file){
  const reader=new FileReader();
  reader.onload=()=>{try{const obj=JSON.parse(reader.result);if(!obj.stats)throw new Error();state=obj;saveState();renderStats();renderResume();alert("成績を復元しました。")}catch(e){alert("バックアップファイルを読み込めませんでした。")}};
  reader.readAsText(file);
}

function formatAmountInput(el){
  const digits=el.value.replace(/[^\d]/g,"");
  if(!digits){el.value="";return}
  el.value=digits.replace(/\B(?=(\d{3})+(?!\d))/g,",");
}

document.getElementById("answerArea").addEventListener("input",e=>{
  if(e.target.classList.contains("amount")) formatAmountInput(e.target);
});

document.getElementById("answerArea").addEventListener("paste",e=>{
  if(!e.target.classList.contains("amount")) return;
  setTimeout(()=>formatAmountInput(e.target),0);
});

document.getElementById("startBtn").onclick=startQuiz;
document.getElementById("gradeBtn").onclick=grade;
document.getElementById("uncertainBtn").onclick=gradeUncertain;
document.getElementById("dontKnowBtn").onclick=gradeDontKnow;
document.getElementById("nextBtn").onclick=nextQ;
document.getElementById("quitBtn").onclick=()=>{document.getElementById("quiz").classList.add("hidden");document.getElementById("setup").classList.remove("hidden");renderResume()};
document.getElementById("resumeBtn").onclick=resumeSession;
document.getElementById("discardSessionBtn").onclick=()=>{state.session=null;saveState();renderResume()};
document.getElementById("backupBtn").onclick=backup;
document.getElementById("restoreBtn").onclick=()=>document.getElementById("restoreFile").click();
document.getElementById("restoreFile").onchange=e=>{if(e.target.files[0])restore(e.target.files[0])};
document.getElementById("resetBtn").onclick=()=>{if(confirm("保存した成績をすべて消しますか？")){state={stats:{},session:null,savedAt:null};saveState();renderStats();renderResume()}};

document.getElementById("loginBtn").onclick=loginGoogle;
document.getElementById("logoutBtn").onclick=logoutGoogle;

loadState();requestPersistentStorage();renderStats();renderResume();updateSaveBadge();
</script>
